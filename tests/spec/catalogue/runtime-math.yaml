  semantic_fixture_validation: tests/spec/contracts/runtime-math.yaml#semantic_fixture_validation_v3
  material_arithmetic: tests/spec/contracts/runtime-math.yaml#widened_material_arithmetic_v3
  default_tt_sanitizer: tests/spec/contracts/runtime-math.yaml#default_tt_sanitizer_isolation_v3
  diagnostic_capture: tests/spec/contracts/runtime-math.yaml#diagnostic_capture_v3
  positive_tt_precondition: tests/spec/contracts/runtime-math.yaml#unavailable_positive_tt_precondition_v3

representability_proofs:
  default_tt_zero: >-
    The literal zero is exactly representable as size_t; this proof neither
    selects a Resize request nor implies that any positive capacity is reachable.
  material_equations: >-
    Use W=std::intmax_t and the numeric_limits proof in
    widened_material_arithmetic_v3. Convert every Score result and named constant
    to W before subtraction or addition, evaluate no expected sum in Score, and
    narrow no result back to Score.
  perft_rows: >-
    Depths 1, 2, and 3 are exactly representable as int. Every frozen count is
    nonnegative and at most 97862, hence exactly representable as U64 without
    relying on a production accumulator intermediate.

oracle_definitions:
  semantic_fixture_validation_v3:
    contracts: [C-BRD-010, C-FEN-010]
    method: >-
      Decode each exact FEN independently. Before the runtime operation, compare
      all labelled-square PieceOn observations, every colour/type Pieces
      projection, active side, named castling rights, semantic en-passant target
      or absence, HalfMoves, and FullMoves with that decoded meaning; also require
      the approved positive-domain IsOk result. A mismatch is a setup/dependency
      failure and the runtime operation is not called.
    forbidden_shortcuts:
      - numeric square orientation or piece encoding
      - numeric castling-bit layout
      - raw ZKey or HashCurrentPostion
      - private history or cache inspection

  default_tt_lifecycle_v3:
    resize_requests: []
    expected_fresh_capacity: 0
    observations: [first GetNumElems, repeated GetNumElems, isolated default destruction]
    sanitizer: linux-clang-address
    diagnostic_capture:
      per_stream_byte_limit: 65536
      required_fields: [stream, captured_bytes, truncated, omitted_bytes_when_known]
      required_truncated_value_for_pass: false
      exact_limit_rule: truncated may be false only when end-of-stream proves that no byte was omitted
    exclusions: >-
      No Resize, Store, Probe, Clear, positive-capacity, allocated destructor,
      leak, or replacement-storage observation belongs to this oracle.

  allocated_tt_candidate_v3:
    resize_requests: []
    positive_capacity_setup: unavailable
    execution: forbidden
    blocking_decisions: [D-TT-001]
    rule: >-
      Do not observe GetNumElems and skip when zero; that branch is vacuous and
      cannot establish an allocated lifecycle responsibility.

  material_fixtures_v3:
    source_scope:
      canonical_serialization: "Colour<TAB>role<TAB>fen<LF>, White rows then Black rows, roles base/pawn/knight/bishop/rook/queen/combined/isolation_base/isolation_opponent_added"
