tests:
  - id: T-RTM-TT-001
    snapshot: 6ea2c5c04bc83b7be7633936c53851154b7203669505af50a6095531a38be592
    title: Fresh zero-capacity TT observation and unallocated destruction
    status: DESIGNED
    contracts: [C-RTM-TT-001]
    symbols: [TransposTable::TransposTable, TransposTable::GetNumElems, TransposTable::~TransposTable]
    categories: [positive, boundary, state-transition, metamorphic, regression]
    setup: >-
      In the one-child linux-clang-address profile, construct one fresh table and
      never call Resize, Store, Probe, or Clear. Configure each diagnostic stream
      with the 65536-byte capture limit and required truncation metadata.
    action: >-
      Observe GetNumElems twice without intervening mutation, let the table leave
      scope exactly once, and collect child exit status and AddressSanitizer output.
    expected: >-
      Both observations equal zero, the child exits normally, AddressSanitizer
      reports no invalid lifetime operation, and every captured stream reports
      truncated=false. This makes no allocated-storage or leak claim.
    oracle:
      type: reference-model
      id: oracle/empty-owner-lifecycle-v3
      provenance: C-RTM-TT-001 and default_tt_lifecycle_v3
      independence_argument: The mathematical empty-owner state and sanitizer ownership instrumentation supply the checks; no production output is sampled.
    diagnostics: >-
      Report test id, operation ordinal, both size_t values, child exit/signal or
      exception, compiler/sanitizer profile, stream, captured byte count,
      truncated true or false, omitted byte count when known, and symbolization
      status. Any truncated sanitizer stream is an infrastructure failure.
    private_access: {required: false, justification: null, approvals: []}
    implementation: {files: [], test_names: []}
    mutants: [default-capacity-nonzero, default-destructor-invalid-free]
    author: blind-design-runtime-math-v3
    reviewers: []
    findings: []

  - id: T-RTM-TT-002
    snapshot: 6ea2c5c04bc83b7be7633936c53851154b7203669505af50a6095531a38be592
    title: Allocated TT lifecycle awaits a non-vacuous positive-capacity setup
    status: BLOCKED
    contracts: [C-RTM-TT-002, C-MOV-010]
    symbols: [TransposTable::Resize, TransposTable::Store, TransposTable::Probe, TransposTable::Clear, TransposTable::~TransposTable, HashEntry]
    categories: [positive, boundary, state-transition, metamorphic, regression]
    setup: >-
      Retain no numeric Resize request. Do not add an allocator seam and do not
      treat an observed zero-capacity table followed by a skip as coverage.
    action: >-
      Do not call Resize, Store, Probe, or Clear and do not run an allocated
      destructor/leak/replacement case until D-TT-001 establishes positive
      capacity non-vacuously.
    expected: >-
      BLOCKED. There is no executable capacity, roundtrip, invalidation,
      allocated-destruction, leak, or replaced-storage result in version 3.
    oracle:
      type: reference-model
      id: oracle/allocated-single-association-pending-v3
      provenance: D-TT-001 and unavailable_positive_tt_precondition_v3
      independence_argument: A future approved non-vacuous setup may enable the responsibility; an observe-and-skip branch cannot.
    diagnostics: >-
      When unblocked, report the approved setup/seam version and authority,
      request units and bounds, observed capacity, operation ordinal, logical
      fields, sanitizer capture metadata, and any setup failure.
    private_access: {required: false, justification: null, approvals: []}
    implementation: {files: [], test_names: []}
    mutants: []
    blocking_decisions: [D-TT-001]
    author: blind-design-runtime-math-v3
    reviewers: []
    findings: []

  - id: T-RTM-EVAL-001
    snapshot: 6ea2c5c04bc83b7be7633936c53851154b7203669505af50a6095531a38be592
    title: Selected-colour named material additivity and opponent isolation
    status: DESIGNED
    contracts: [C-RTM-EVAL-001, C-BRD-010, C-FEN-010]
    symbols: [Eval::CountMaterial, Eval::PAWN_VAL, Eval::KNIGHT_VAL, Eval::BISHOP_VAL, Eval::ROOK_VAL, Eval::QUEEN_VAL, Board::PieceOn, Board::Pieces, Position::IsOk]
    categories: [positive, boundary, metamorphic, differential]
    setup: >-
      Exhaust both colour branches of material_fixtures_v3 with a fresh Position
      per call. Before CountMaterial, apply semantic_fixture_validation_v3 to the
      exact FEN and establish the widened W proof.
    action: >-
      Instantiate CountMaterial with the branch's selected colour. Widen every
      returned Score and named constant before arithmetic; compare each
      single-minus-base difference with its named constant, combined-minus-base
      with the five-constant W sum, and the two opponent-isolation results.
    expected: >-
      Every selected-colour named-constant difference and additivity equation
      holds for White and Black, and changing only opponent non-king material has
      no effect. Baseline zero, king value, literal weights, colour/square
      symmetry, and Position mutation are not asserted.
    oracle:
      type: metamorphic
      id: oracle/selected-colour-named-material-differences-v3
      provenance: semantically validated fixture multisets, declaration-named constants, and widened equations
      independence_argument: No coefficient or baseline is sampled from TDFA; each public named constant is bound only to its selected piece contribution.
    diagnostics: >-
      Report selected colour, fixture id and exact FEN, fixture-validation field
      or setup failure, semantic piece delta, raw Scores, every W operand/result,
      named constant, proof bit widths and bounds, equation id, and the widened
      expected/actual difference.
    private_access: {required: false, justification: null, approvals: []}
    implementation: {files: [], test_names: []}
    mutants: [selected-colour-filter-ignored, opponent-material-counted, pawn-constant-misbinding, knight-constant-misbinding, bishop-constant-misbinding, rook-constant-misbinding, queen-constant-misbinding, disjoint-material-not-additive, black-template-reads-white]
    author: blind-design-runtime-math-v3
    reviewers: []
    findings: []

  - id: T-RTM-EVAL-002
    snapshot: 6ea2c5c04bc83b7be7633936c53851154b7203669505af50a6095531a38be592
    title: Evaluate repeats on identical semantic FEN and preserves all public FEN fields
    status: DESIGNED
    contracts: [C-RTM-EVAL-002, C-BRD-010, C-FEN-010]
    symbols: [Eval::Evaluate, Board::PieceOn, Board::Pieces, Position::ColourToMove, Position::CastlingRights, Position::EnPasBB, Position::EnPasSq, Position::HalfMoves, Position::FullMoves, Position::IsOk]
    categories: [positive, state-transition, metamorphic, regression]
    setup: >-
      For each evaluate_identical_fen_fixtures_v3 entry, construct A and B from
      exactly the same canonical FEN bytes. Validate both semantically and capture
      full_public_fen_semantic_snapshot_v3 for each before Evaluate.
    action: >-
      Evaluate A, recapture its full snapshot, evaluate A again without caller
      mutation, recapture it, then evaluate B once and recapture B. Compare every
      post-call snapshot with its own pre-call snapshot and compare all three Scores.
    expected: >-
      Every call preserves all labelled placement observations, active side,
      named castling rights, semantic en-passant state, HalfMoves, and FullMoves;
      the two A results and one B result are exactly equal. A constant-zero
      evaluator survives deliberately: no score magnitude, nonzero, sign,
      perspective transform, hash, or history responsibility is claimed.
    oracle:
      type: metamorphic
      id: oracle/identical-fen-observer-purity-v3
      provenance: exact selected corpus scope, semantic validation, same-object repetition, and independently constructed byte-identical FEN
      independence_argument: The first Score seeds equality comparisons only; no numeric evaluator result becomes an expected oracle.
    diagnostics: >-
      Report case id, exact FEN and selected-scope hash, object/call ordinal,
      returned Score for diagnosis only, semantic validation outcome, and a
      field-by-field diff covering PieceOn, Pieces, side, named rights, semantic
      en-passant state, and both clocks.
    private_access: {required: false, justification: null, approvals: []}
    implementation: {files: [], test_names: []}
    mutants: [evaluate-same-object-score-drifts, evaluate-identical-fen-object-score-drifts, evaluate-address-dependent-score, evaluate-mutates-piece-map, evaluate-mutates-colour-or-type-occupancy, evaluate-mutates-active-side, evaluate-mutates-castling-rights, evaluate-mutates-en-passant, evaluate-mutates-halfmove-clock, evaluate-mutates-fullmove-number]
    deliberate_surviving_mutants: [constant-zero-evaluator, side-to-move-ignored-with-stable-score]
    author: blind-design-runtime-math-v3
    reviewers: []
    findings: []

  - id: T-RTM-EVAL-003
    snapshot: 6ea2c5c04bc83b7be7633936c53851154b7203669505af50a6095531a38be592
    title: Evaluate side-to-move perspective awaits an approved score relation
    status: BLOCKED
    contracts: [C-RTM-EVAL-003, C-BRD-010, C-FEN-010]
    symbols: [Eval::Evaluate, Position::ColourToMove]
    categories: [metamorphic, differential]
    setup: >-
      Retain evaluate_perspective_candidate_v3 only. Its canonical pair has the
      same placement, rights, en-passant field, and clocks and differs only in
      active side; do not execute the pair before D-EVAL-001.
