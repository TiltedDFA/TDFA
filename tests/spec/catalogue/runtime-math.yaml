    persisted_document: false

approval_state:
  contract_cards: CANDIDATE_UNAPPROVED
  tests: CANDIDATE
  semantic_dependencies: SATISFIED_AT_PINNED_EXTERNAL_HASH
  note: >-
    DESIGNED means design-complete only. Every local card is TENTATIVE or
    UNRESOLVED and has no author approval. All required external semantic cards
    are independently APPROVED at the pinned external-math hash; local card and
    test review requirements still govern any advance to EXPECTATION_FROZEN.

status_policy:
  DESIGNED: >-
    Setup, action, expectation, oracle, diagnostics, representability, and only
    directly killed mutants are specified without selecting an excluded policy.
  BLOCKED: >-
    A future responsibility is retained, but this record executes nothing,
    asserts no result, and claims no mutant kill until every listed decision or
    observation precondition is independently approved.

