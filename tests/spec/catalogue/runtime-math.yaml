    oracle:
      type: reference-model
      id: oracle/evaluate-perspective-pending-v3
      provenance: D-EVAL-001 and the retained semantic pair
      independence_argument: The pair isolates active side, but cannot itself choose the score relation.
    diagnostics: >-
      When unblocked, report decision version, both exact FENs, semantic pair
      validation, approved transform, both Scores, and widened comparison if any.
    private_access: {required: false, justification: null, approvals: []}
    implementation: {files: [], test_names: []}
    mutants: []
    blocking_decisions: [D-EVAL-001]
    author: blind-design-runtime-math-v3
    reviewers: []
    findings: []

  - id: T-RTM-EVAL-004
    snapshot: 6ea2c5c04bc83b7be7633936c53851154b7203669505af50a6095531a38be592
    title: Evaluate hash and private-history purity await observation authority
    status: BLOCKED
