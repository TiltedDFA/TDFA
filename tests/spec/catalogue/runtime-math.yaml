        bishop: "k7/8/8/2b5/8/8/8/7K b - - 0 1"
        rook: "k7/8/8/4r3/8/8/8/7K b - - 0 1"
        queen: "k7/6q1/8/8/8/8/8/7K b - - 0 1"
      combined: "k7/1p4q1/2n5/2b1r3/8/8/8/7K b - - 0 1"
      isolation_base: "k7/q7/8/8/8/8/8/7K b - - 0 1"
      isolation_opponent_added: "k7/q7/8/8/8/8/2QRBN1P/7K b - - 0 1"
    named_constants:
      pawn: Eval::PAWN_VAL
