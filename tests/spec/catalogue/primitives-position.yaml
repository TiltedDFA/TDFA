status_policy:
  DESIGNED: >-
    The expectation is fixed by a cited mathematical, FEN, UCI, or FIDE
    authority and does not select among the contract's open decisions.
  BLOCKED: >-
    The test shape and mutant target are recorded, but no pass/fail expectation
    is frozen until the listed owner decision is made.

