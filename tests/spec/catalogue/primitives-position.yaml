oracle_definitions:
  semantic-position-snapshot-v1:
    fields:
      - >-
        expected labelled_piece_map: a test-owned FEN decoder uses integer
        (file,rank) coordinates and literal labels from {a..h}x{1..8}; it never
        calls a production helper. Actual observations are normalized separately
        by enumerating Sq 0..63 and labelling PieceOn(Sq) with UTIL::Square(Sq).
        That product conversion is an observation under C-UTL-001, never an
        input to expected-value construction, and numeric label association is
        not asserted while C-BB-006 is unresolved
      - "white_occupancy and black_occupancy as labelled square sets"
      - "six per-type occupancies as labelled square sets"
      - "active colour"
      - >-
        expected castling_rights as a test-owned set decoded only from the FEN
        names {K,Q,k,q}. Actual CastlingRights is projected separately to those
        names with CASTLE_K_W, CASTLE_Q_W, CASTLE_K_B, and CASTLE_Q_B, rejecting
        unknown raw bits; production constants never construct the expected set
      - >-
        expected en-passant label is decoded directly from FEN by the test-owned
        coordinate model. Actual present EnPasSq/EnPasBB observations are
        normalized to a label after capture; '-' expects zero EnPasBB and does
        not inspect the unresolved absent-target Sq sentinel
      - "halfmove and fullmove counters"
    exclusions:
      - "No absent-en-passant Sq sentinel is compared."
      - "No hash correctness is assumed unless a test explicitly names it."
      - "No move-list ordering is observed."
      - >-
        No a1/a8 numeric origin is assumed: orientation-specific assertions
        remain blocked in T-BB-007/T-BB-011/T-UTL-002.
  chess-transition-model-v1:
    input: "A legal semantic-position-snapshot-v1 and a legal long-algebraic UCI move."
    rules:
      - "Move the named source piece to the named target; remove an ordinary captured target piece."
      - "For en-passant, remove the opposing pawn behind the target square."
      - "For castling, also move the same-colour rook from its conventional corner to f-file or d-file."
      - "For promotion, replace the pawn at target with exactly the q/r/b/n suffix piece."
      - "Remove both rights when a king moves; remove the relevant right when its rook moves or is captured on its home square."
      - "Set en-passant to the crossed square only after a two-square pawn move; otherwise set '-'."
      - "Reset halfmove after a pawn move or capture; otherwise increment it by one."
      - "Flip active colour; increment fullmove exactly after a Black move."
    provenance: "FIDE move effects and standard six-field FEN semantics; no TDFA helper participates in the transition."

tests:
  - id: T-TYP-001
    snapshot: 6ea2c5c04bc83b7be7633936c53851154b7203669505af50a6095531a38be592
    title: Colour negation is the exhaustive two-colour involution
    status: DESIGNED
    contracts: [C-TYP-001]
    symbols: ["Colour operator!(Colour)"]
    categories: [positive, exhaustive, metamorphic]
    setup: "The complete valid domain {White, Black}."
    action: "For each c, evaluate !c and !(!c)."
    expected: >-
      !White is Black, !Black is White, the result differs from the input, and
      applying the operation twice returns the original enumerator.
    oracle:
      type: exhaustive-model
      id: oracle/colour-involution-v1
      provenance: "Truth table for the complement permutation on a two-element set."
      independence_argument: "The two rows are literal mathematical expectations and use no TDFA encoding values."
    diagnostics: "Report input/result enumerator names and underlying integer values for both applications."
    private_access: {required: false, justification: null, approvals: []}
    implementation: {files: [], test_names: []}
    mutants: [identity-negation, constant-colour-result, one-sided-swap]
    author: blind-design-state
    reviewers: []
    findings: []

  - id: T-TYP-002
    snapshot: 6ea2c5c04bc83b7be7633936c53851154b7203669505af50a6095531a38be592
    title: FloatDiv returns exact representable quotients for ordinary nonzero divisors
    status: DESIGNED
    contracts: [C-TYP-002]
    symbols: ["template<typename T> float FloatDiv(T, T)"]
    categories: [positive, boundary, metamorphic]
    setup: >-
      Instantiate T exactly as U8, U16, U32, U64, I16, int, and float. For every
      T use (0,1), (1,1), (1,2), (3,2), and (8,8); for I16, int, and float also
      use (-1,1), (1,-2), and (-3,-2). All operands and expected results are
      exactly representable as float.
    action: "Evaluate FloatDiv for every listed tuple and for tuples scaled by 2 when the input type cannot overflow."
    expected: >-
      Results are respectively 0.0f, 1.0f, 0.5f, 1.5f, and 1.0f; signed
      cases preserve the quotient sign. Scaling both operands by 2 leaves the
      result unchanged.
    oracle:
      type: reference-model
      id: oracle/exact-binary-rational-v1
      provenance: "Exact integer/rational arithmetic restricted to values representable in binary32."
      independence_argument: "Expected literals are derived before execution and do not call FloatDiv or native integer division as the oracle."
    diagnostics: "Report T, decimal and hexadecimal operands, scaled flag, expected float bits, and actual float bits."
    private_access: {required: false, justification: null, approvals: []}
    implementation: {files: [], test_names: []}
    mutants: [integer-division-before-cast, reversed-operands, forced-absolute-value, truncating-return]
    author: blind-design-state
    reviewers: []
    findings: []

  - id: T-TYP-003
    snapshot: 6ea2c5c04bc83b7be7633936c53851154b7203669505af50a6095531a38be592
    title: Primitive width guarantees and FloatDiv exceptional inputs await policy
    status: BLOCKED
    contracts: [C-TYP-002]
    symbols: ["primitive aliases", "template<typename T> float FloatDiv(T, T)"]
    categories: [negative, boundary]
    setup: >-
      Candidate cases are sizeof/numeric_limits checks for every width-named
      alias, zero divisors for integral and floating T, infinities, NaNs,
      values not exactly representable as float, and large operands whose
      intermediate arithmetic could overflow.
    action: "Do not execute semantic assertions until D-TYP-001 defines portability and exceptional arithmetic behavior."
    expected: >-
      BLOCKED: the dossier's aliases are declarations, but no approved contract
      promises exact bit widths, IEEE-754 behavior, rounding, or a zero-divisor
      policy.
    oracle:
      type: standard
      id: oracle/cpp-platform-contract-pending-v1
      provenance: "D-TYP-001 in tests/spec/decision-ledger.md."
      independence_argument: "No current compiler ABI or observed TDFA result is treated as the intended contract."
    diagnostics: "When unblocked, report compiler, CHAR_BIT, all sizeof values, numeric_limits traits, operands, result bits, and floating exceptions."
    private_access: {required: false, justification: null, approvals: []}
    implementation: {files: [], test_names: []}
    mutants: [wrong-alias-width, signedness-change, divide-by-zero-trap, premature-rounding]
    author: blind-design-state
    reviewers: []
    findings: []

  - id: T-MOV-001
    snapshot: 6ea2c5c04bc83b7be7633936c53851154b7203669505af50a6095531a38be592
    title: Move component encoding round-trips the complete valid component product
    status: DESIGNED
    contracts: [C-MOV-001]
    symbols: ["Moves::EncodeMove", "Moves::DecodeMove", "Moves::StartSq", "Moves::TargetSq"]
    categories: [positive, boundary, exhaustive, metamorphic]
    setup: >-
      Cartesian product of all start squares 0..63, all different target
      squares 0..63, and the semantic move kinds mt_Quiet, mt_EnPassant,
      mt_Castling, mt_Capture, mt_QueenPromotion, mt_BishopPromotion,
      mt_KnightPromotion, and mt_RookPromotion (32,256 tuples). The marker
      mt_Promotion is deliberately excluded pending D-MOV-001.
    action: >-
      Encode every tuple; decode it through DecodeMove and independently through
      StartSq and TargetSq; then re-encode the decoded components.
    expected: >-
      Both decoding paths return the exact input start and target and DecodeMove
      returns the exact semantic MoveType. Re-encoding yields the original Move.
      Encodings of two tuples that differ in exactly one component are distinct.
    oracle:
      type: exhaustive-model
      id: oracle/move-component-product-v1
      provenance: "Finite-product encode/decode inverse law; domain enumerated literally from the declarations."
      independence_argument: "The oracle stores the input tuple and compares projections; it knows no masks, shifts, or TDFA representation constants."
    diagnostics: "Report tuple ordinal, named and underlying move type, input/decoded squares, encoded Move in hex/binary, and which projection failed."
    private_access: {required: false, justification: null, approvals: []}
    implementation: {files: [], test_names: []}
    mutants: [start-mask-too-small, target-shift-off-by-one, swapped-squares, move-type-truncation, field-overlap, decode-only-mask-error]
    author: blind-design-state
    reviewers: []
    findings: []

