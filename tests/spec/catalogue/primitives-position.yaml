  - id: T-MOV-004
    snapshot: 6ea2c5c04bc83b7be7633936c53851154b7203669505af50a6095531a38be592
    title: Valid corpus UCI moves parse and render canonically
    status: DESIGNED
    contracts: [C-MOV-001, C-MOV-002, C-UTL-001, C-FEN-001]
    symbols: ["UTIL::UciToMove", "UTIL::MoveToStr", "Moves::DecodeMove", "Moves::StartSq", "Moves::TargetSq", "Moves::IsPromotionMove"]
    categories: [positive, boundary, exhaustive, differential, protocol]
    setup: >-
      Every non-hyphen token in legal_uci from every row of
      tests/data/oracle_cases.tsv at scoped data SHA-256
      7c6bfab18aecbf89e6da7cdcc29b258edb13bf916804c9f211cb9752c7cb4e77
      (column header through final LF; metadata/comment lines excluded).
      Construct a fresh Position from that row's FEN for each token. Freeze the
      exact type sentinels: start/g1f3=mt_Quiet,
      kiwipete/e2a6=mt_Capture,
      en_passant_legal/e5d6=mt_EnPassant,
      castling_minimal/e1c1 and e1g1=mt_Castling,
      promotion_choices/a7a8q=mt_QueenPromotion, a7a8r=mt_RookPromotion,
      a7a8b=mt_BishopPromotion, a7a8n=mt_KnightPromotion, and
      perft_castling/d7c8q,r,b,n equal the corresponding promotion MoveType.
    action: "Parse the token with UciToMove, render it with MoveToStr, and inspect its component/promotion projections."
    expected: >-
      Rendering returns the exact lowercase corpus token. For the frozen
      sentinels DecodeMove returns the exact named MoveType above, not merely a
      numeric range or promotion predicate. Each five-character corpus token is
      classified as promotion and preserves its suffix; each four-character
      token is non-promotion. Start/target numeric expectations are excluded here
      pending C-BB-006 and are covered by T-UTL-002.
    oracle:
      type: corpus
      id: oracle/tdfa-chess-oracle-v1/legal-uci
      provenance: "tests/data/oracle_cases.tsv; python-chess 1.11.2 committed profile; scoped data SHA-256 7c6bfab18aecbf89e6da7cdcc29b258edb13bf916804c9f211cb9752c7cb4e77 covers the column header through final LF and excludes metadata/comment lines."
      independence_argument: "Expected strings are frozen outside TDFA and comparison never asks TDFA to generate the expected move."
    diagnostics: "Report case_id, FEN, token ordinal, token, encoded bits, rendered text, expected/actual named and underlying MoveType, and promotion predicate."
    private_access: {required: false, justification: null, approvals: []}
    implementation: {files: [], test_names: []}
    mutants: [case-error, missing-promotion-suffix, castling-as-quiet, capture-as-quiet, en-passant-as-capture, underpromotion-type-swap, position-insensitive-parse]
    author: blind-design-state
    reviewers: []
    findings: [F-006]

