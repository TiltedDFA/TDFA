oracle_definitions:
  semantic-root-snapshot-v1:
    fields:
      - labelled piece map over a1 through h8
      - white and black occupancy sets
      - per-piece-type occupancy sets
      - active colour
      - castling-right set by named rights, never assumed numeric values
      - en-passant target label or absent marker
      - halfmove and fullmove counters
      - explicit HashCurrentPostion return, compared only for equal restored states
    hidden_history_probe: >-
      After an allegedly preserving operation, apply and unapply each selected
      legal root move and compare every prefix/restoration with a fresh
      independently constructed reference position. This exercises hidden
      reversible-state damage without private access.
    exclusions:
      - No absent en-passant square sentinel is guessed.
      - No distinct-state hash inequality is required.
      - No move ordering is observed.

  reference-evaluation-v1:
    state: BLOCKED_PENDING_D_EVAL_001
    planned_inputs:
      - semantic position decoded independently from FEN
      - piece counts by named colour and named PieceType
      - independently generated legal mobility sets if mobility is defined as legal
      - independently generated pseudo-legal mobility sets if that definition is selected
      - pawn ranks expressed as standard square labels
    freeze_rule: >-
      After D-EVAL-001 is decided, record every component formula, named
      coefficient, phase boundary, perspective transform, numeric range, and
      exceptional score before compiling a TDFA test. No current TDFA value may
      be copied into the oracle.
    prohibited_shortcuts:
      - Treating Eval::Evaluate output as its own expected leaf value.
      - Inferring a sign convention from a passing example.
      - Assuming conventional material values whose dossier initializers are omitted.

  reference-negamax-v1:
    state: BLOCKED_PENDING_D_EVAL_001_AND_D_SRCH_001
    tree_source: >-
      A test-owned chess transition model enumerates legal children as unordered
      sets. It must be checked against the frozen legal-move/perft corpus but may
      not call TDFA generation, make/unmake, evaluation, search, or TT code.
    recurrence: >-
      Once perspective is approved, transform every leaf and terminal score to
      side-to-move coordinates and compute N(p,d)=max over legal moves m of
      -N(child(p,m),d-1). If the approved evaluation is fixed-colour rather than
      side-to-move, freeze the explicit sign transform first. Alpha/beta is an
      optimization of this complete recurrence, not the oracle.
    terminal_rule: >-
      Checkmate, stalemate, draw, mate-distance, and depth-zero leaf values are
      parameters that remain absent until D-SRCH-001 and D-RULE-001 are decided.
    best_move_rule: >-
      The model returns the complete unordered argmax set. A selected root move
      is compared by membership unless an owner decision explicitly makes tie
      ordering contractual.
    fixture_freeze: >-
      Freeze root FEN, depth, complete leaf/terminal table, expected root score,
      and argmax set in an offline fixture before the test is compiled or TDFA
      is run.

  tt-abstract-match-v1:
    definition: >-
      match(k,p) means p is non-null, valid to inspect under the approved pointer
      lifetime, and p->key_ equals k. This predicate permits a Probe miss policy
      that returns either null or a nonmatching slot until D-TT-003 chooses one.
    algebra_after_unblocking:
      - A successful single store into an empty positive-capacity table creates one matching association.
      - Repeating the identical store is idempotent at the abstract-map level.
      - Clear removes every matching association and repeating Clear is idempotent.
      - Store and Clear do not change capacity unless the approved contract says otherwise.
    caution: >-
      Collision keys, replacement winners, field overwrite rules, and pointer
      survival are deliberately not derived from a presumed modulo index.

  uci-process-transcript-v1:
    input_events:
      - START starts one fresh child with redirected binary stdin/stdout/stderr.
      - >-
        SEND records exact bytes and writes them asynchronously. The write must
        complete before its absolute write deadline; a blocked pipe cannot block
        the watchdog thread.
      - CLOSE_STDIN closes the write end exactly once.
      - WAIT_LINE reads stdout and stderr concurrently without imposing cross-channel ordering.
      - WAIT_EXIT waits without abandoning pipe drains.
    output_record: >-
      Record event ordinal, channel, exact escaped bytes and hex, line-ending
      kind, parsed leading UCI token when any, child exit code/status, watchdog
      phase, and monotonic elapsed milliseconds. Assertions use event order and
      tokens; timestamps are diagnostic except for the harness ceiling.
    line_handling: >-
      Accept LF, CRLF, and lone CR as line framing while retaining raw bytes.
      Do not trim bytes other than protocol-permitted surrounding ASCII
      whitespace when tokenizing a command or response.
    launch_record:
      - exact executable path and SHA-256
      - complete argument vector
      - working directory
      - inherited environment allowlist and locale
      - operating system, architecture, build mode, and instrumentation
      - exact child process identity and Windows Job Object or equivalent process-group identity
    isolation: >-
      Start every child in a kill-on-close Windows Job Object or equivalent
      process group before delivering input. Hard cleanup targets only that
      recorded group, waits for its members to exit, and then drains/closes all
      three pipes without relying on parent/child PID enumeration after launch.
    watchdogs:
      stdin_write_ceiling_ms: 10000
      response_ceiling_ms: 10000
      graceful_exit_ceiling_ms: 10000
      total_case_ceiling_ms: 60000
      hard_cleanup_ceiling_ms: 30000
      interpretation: >-
        Every ceiling is an absolute monotonic deadline anchored to the event
        that starts its named phase and is never extended by partial output.
        Write, response, exit, and total-case expiry report distinct liveness
        failures. At hard cleanup the harness terminates only the recorded child
        process group and reports cleanup separately; no watchdog result is a
        TimeManager correctness result.
    resource_limits:
      max_stdin_event_bytes: 1048576
      max_stdout_retained_bytes: 8388608
      max_stderr_retained_bytes: 8388608
      max_line_bytes: 1048576
      max_output_events: 100000
      overflow_handling: >-
        Crossing a limit is a harness resource failure. Async drains continue to
        count and discard excess bytes until exit or the absolute phase deadline,
        so a full pipe cannot deadlock cleanup. Retain the prefix, final bounded
        suffix, total byte/event counts, and the first overflow ordinal.
    protocol_line_classes:
      handshake: [id, option, uciok]
      readiness: [readyok]
      search: [info, bestmove]

  malformed-application-bytes-v1:
    isolation: one fresh subprocess per case
    case_count: 9
    scope_note: >-
      The long-unknown-token row is standard-ignored input semantically and is
      retained here only as an adversarial resource-safety case; T-APP-017 fixes
      ordinary unknown-token liveness and T-APP-018 fixes state preservation.
    cases:
      - {id: position-empty, bytes_text: "position LF", bytes_hex: "70 6f 73 69 74 69 6f 6e 0a"}
      - {id: position-startpos-bad-move, bytes_text: "position startpos moves e2e9 LF", bytes_hex: "70 6f 73 69 74 69 6f 6e 20 73 74 61 72 74 70 6f 73 20 6d 6f 76 65 73 20 65 32 65 39 0a"}
      - {id: position-short-fen, bytes_text: "position fen 8/8/8/8/8/8/8/8 w LF", bytes_hex: "70 6f 73 69 74 69 6f 6e 20 66 65 6e 20 38 2f 38 2f 38 2f 38 2f 38 2f 38 2f 38 2f 38 20 77 0a"}
      - {id: setoption-empty, bytes_text: "setoption LF", bytes_hex: "73 65 74 6f 70 74 69 6f 6e 0a"}
      - {id: setoption-hash-nonnumeric, bytes_text: "setoption name Hash value NaN LF", bytes_hex: "73 65 74 6f 70 74 69 6f 6e 20 6e 61 6d 65 20 48 61 73 68 20 76 61 6c 75 65 20 4e 61 4e 0a"}
      - {id: go-depth-empty, bytes_text: "go depth LF", bytes_hex: "67 6f 20 64 65 70 74 68 0a"}
      - {id: embedded-nul, bytes_text: "isready NUL suffix LF", bytes_hex: "69 73 72 65 61 64 79 20 00 20 73 75 66 66 69 78 0a"}
      - {id: invalid-utf8, bytes_text: "FF FE LF", bytes_hex: "ff fe 0a"}
      - {id: long-unknown-token, bytes_text: "65536 ASCII x bytes then LF", generator: "repeat byte 0x78 exactly 65536 times, append 0x0a"}

  uci-standard-input-variants-v1:
    authority: UCI arbitrary-whitespace, line-framing, and unknown-token rules
    case_count: 8
    cases:
      - {id: blank-lf, bytes_text: "LF", bytes_hex: "0a", expected_class: ignored-empty-line}
      - {id: spaces-lf, bytes_text: "SP HT SP LF", bytes_hex: "20 09 20 0a", expected_class: ignored-empty-line}
      - {id: unknown-lf, bytes_text: "x-unknown LF", bytes_hex: "78 2d 75 6e 6b 6e 6f 77 6e 0a", expected_class: ignored-unknown-command}
      - {id: uci-extra-lf, bytes_text: "uci SP extra LF", bytes_hex: "75 63 69 20 65 78 74 72 61 0a", expected_class: uci-with-ignored-token}
      - {id: uci-padded-lf, bytes_text: "HT SP uci SP HT LF", bytes_hex: "09 20 75 63 69 20 09 0a", expected_class: uci}
      - {id: uci-cr, bytes_text: "uci CR", bytes_hex: "75 63 69 0d", expected_class: uci}
      - {id: uci-crlf, bytes_text: "uci CR LF", bytes_hex: "75 63 69 0d 0a", expected_class: uci}
      - {id: isready-padded, bytes_text: "SP HT isready HT SP LF", bytes_hex: "20 09 69 73 72 65 61 64 79 09 20 0a", expected_class: isready}

  distinguishable-position-fixture-v1:
    state: BLOCKED_UNTIL_FROZEN
    required_fields:
      - case_id
      - exact position command bytes
      - independently decoded final FEN and complete history
      - sorted complete legal UCI set
      - every stale or partial candidate state and its sorted complete legal set
      - proof that one observable transcript distinguishes the intended state from every candidate
      - fixture SHA-256
    acceptance_rule: >-
      A single unconstrained bestmove is not a state oracle when legal sets
      overlap. Freeze either a singleton intended legal set disjoint from every
      candidate, or an approved searchmoves/other protocol observation with an
      independent proof of distinction. Until such rows exist, application
      position-commit assertions remain BLOCKED.

