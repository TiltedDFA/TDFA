status_policy:
  DESIGNED: >-
    The asserted observation follows from UCI/FEN/FIDE, ordinary C++ object
    lifetime, a frozen corpus, or an implementation-independent algebra. It
    does not select an answer to an open owner decision.
  BLOCKED: >-
    The setup, action, diagnostic record, and mutant classes are frozen, but no
    disputed score, time, replacement, failure, or recovery result is guessed.
    The named decisions and every cited contract card must be approved before
    the expectation can be frozen.
  subprocess_watchdog: >-
    A watchdog is a harness liveness ceiling, not a TimeManager oracle or a
    promise about search polling latency. A watchdog failure cannot be used to
    infer the missing internal time contract.

scope_notes:
  - >-
    C++ visibility does not make an API application-facing. Direct utility
    calls below are valid-domain supporting-symbol checks; application behavior
    is observed only through the child process.
  - >-
    Invalid UTIL::UciToMove, UTIL::MoveToStr, RemoveWhiteSpace, SplitFen, and
    IsDigit policies remain under D-MOV-001, D-MOV-003, and D-UTIL-001. This
    catalogue does not duplicate or override the blocked invalid-input designs
    in the primitives-position catalogue.
  - >-
    No test uses sleep duration as a semantic expectation. Deterministic search
    cancellation remains blocked unless an approved clock or polling seam is
    made available without changing release behavior.

