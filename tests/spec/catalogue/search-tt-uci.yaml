cross_catalogue_validation_rule: >-
  Before implementing or running a dependent test, recompute the exact catalogue
  SHA-256, require the snapshot and every named test id to match, and hard-stop
  on any difference until this dependency record is reviewed.

tests:
  - id: T-EVAL-001
    snapshot: 6ea2c5c04bc83b7be7633936c53851154b7203669505af50a6095531a38be592
    title: Evaluation components await an approved independent arithmetic model
    status: BLOCKED
    contracts: [C-EVAL-001]
    symbols: [Eval::CountMaterial<Colour>, Eval::Mobility<Colour>, Eval::PawnProgress<Colour>]
    categories: [positive, boundary, exhaustive, differential]
    setup: >-
      Planned roots are every curated row in oracle_cases.tsv plus paired FENs
      that swap colours, mirror files, and vary one named piece or pawn rank at
      a time. Freeze all pairs and expected component values only after
      D-EVAL-001 defines perspective, component formulas, and coefficient use.
    action: >-
      For both template colours, compare every component with
      reference-evaluation-v1; enumerate the independent move set used by any
      approved mobility definition.
    expected: >-
      BLOCKED: material sign, own-versus-opponent scope, legal-versus-pseudo
      mobility, pawn direction/rank bonuses, phase dependence, and score range
      are not frozen.
    oracle:
      type: reference-model
      id: oracle/reference-evaluation-v1/components
      provenance: D-EVAL-001, oracle_cases.tsv data_sha256 7c6bfab18aecbf89e6da7cdcc29b258edb13bf916804c9f211cb9752c7cb4e77, and an offline FEN/arithmetic fixture to be frozen after that decision
      independence_argument: No TDFA evaluator, generator, constant initializer, or observed score supplies an expected value.
    diagnostics: >-
      Report case/pair id, FEN, template colour, decoded piece counts and pawn
      labels, independent mobility set, every formula term, expected/actual
      score in decimal and hex, and first differing term.
    private_access: {required: false, justification: null, approvals: []}
    implementation: {files: [], test_names: []}
    mutants:
      - colour-count-swapped
      - missing-piece-class
      - material-sign-inverted
      - pseudo-versus-legal-mobility
      - pawn-rank-off-by-one
      - black-pawn-direction-reversed
      - phase-threshold-shift
      - score-overflow
    author: blind-design-search-tt-uci
    reviewers: []
    findings: []

  - id: T-EVAL-002
    snapshot: 6ea2c5c04bc83b7be7633936c53851154b7203669505af50a6095531a38be592
    title: Aggregate evaluation perspective, symmetry, sentinels, and range await policy
    status: BLOCKED
    contracts: [C-EVAL-002]
    symbols: [Eval::Evaluate, Eval::POS_INF, Eval::NEG_INF, Eval::OUT_OF_TIME]
    categories: [positive, negative, boundary, metamorphic, differential]
    setup: >-
      Planned cases include all legal corpus positions; colour-swapped board and
      side-to-move pairs; file mirrors; equal-material asymmetric-mobility pairs;
      and positions near each approved score bound. Terminal positions are kept
      separate from ordinary leaf evaluation.
    action: >-
      Evaluate independent constructions of each semantic state twice and apply
      only the symmetry transforms selected by D-EVAL-001.
    expected: >-
      BLOCKED: side-to-move versus fixed-colour perspective, which transforms
      negate or preserve a score, whether terminal positions are accepted, the
      valid numeric interval, and whether OUT_OF_TIME can be an evaluation value
      are undecided.
    oracle:
      type: reference-model
      id: oracle/reference-evaluation-v1/aggregate
      provenance: D-EVAL-001 and frozen transformed-position pairs
      independence_argument: Symmetries are activated only when their mathematical preconditions and score transform are owner-approved.
    diagnostics: >-
      Report transform id, both FENs and semantic snapshots, side to move,
      expected transform equation, every component term, actual scores and
      named sentinel values, and repeat ordinal.
    private_access: {required: false, justification: null, approvals: []}
    implementation: {files: [], test_names: []}
    mutants:
      - wrong-score-perspective
      - side-to-move-omitted
      - mirror-asymmetry
      - accidental-terminal-evaluation
      - out-of-time-aliases-valid-score
      - narrow-score-wraparound
      - address-dependent-evaluation
    author: blind-design-search-tt-uci
    reviewers: []
    findings: []

  - id: T-EVAL-003
    snapshot: 6ea2c5c04bc83b7be7633936c53851154b7203669505af50a6095531a38be592
    title: UpdateData, global phase state, determinism, and position preservation await policy
    status: BLOCKED
    contracts: [C-EVAL-003]
    symbols: [Eval::UpdateData, Eval::Evaluate, Eval::is_middle_game]
    categories: [state-transition, metamorphic, regression]
