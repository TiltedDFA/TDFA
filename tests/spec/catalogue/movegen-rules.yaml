schema_version: 1
catalogue_version: 5
snapshot: &snapshot 6ea2c5c04bc83b7be7633936c53851154b7203669505af50a6095531a38be592
contracts_version: 0
status: CANDIDATE_WITH_EXPLICIT_BLOCKERS
authoring_mode: implementation-blind
author: &author blind-design-movegen-rules
test_record_lifecycle: CANDIDATE
approval_note: >-
  Every local contract reference is PROPOSED, not an approved contract card.
  DESIGNED test records are candidates only and cannot advance to
  EXPECTATION_FROZEN until their referenced cards and oracle translations are
  independently approved.

scope:
  included:
    - finite chess-board geometry and destination encoding
    - piece and pawn pseudo-legal movement
    - attack maps and check detection
    - complete legal move sets and king-safety filtering
    - pins, single check, double check, en passant, castling, and promotion
    - generator and recursive-state preservation
    - offline legal-move and perft differential oracles
    - standard checkmate, stalemate, and draw outcomes
    - diagnostics and adversarial mutant sensitivity
  excluded:
    - search quality, evaluation, timing, and transposition-table behavior
    - invalid FEN parsing behavior governed by D-POS-001
    - legacy Testing.hpp helpers governed by D-LEG-001 and D-LEG-002
    - any expectation inferred from TDFA source bodies or TDFA output

information_firewall:
  permitted_inputs:
    - tests/README.md
    - tests/spec/**
    - tests/data/**
    - perftsuite.epd
  production_executed: false
  implementation_bodies_inspected: false
  comparison_policy: >-
    Unless a future approved contract says otherwise, move collections are
    compared as duplicate-free sets of decoded logical UCI moves, never by
    production iteration order or raw encoded integer value. Before a MoveList
    generator call, derive the expected set, construct a dedicated list, observe
    all().size(), and call only when the expectation fits; afterward require
    len()<=that observed capacity before indexing [0,len()). No constructor len
    value or minimum capacity is assumed. For move_info, derive the expected set
    first; null is an allowed empty representation, a nonempty expectation
    requires non-null, and any non-null result must satisfy
    count_<=encoded_move_.size() before prefix access. Every Position is
    searchable and its template colour equals Position::ColourToMove().

square_observation_policy:
  expected_domain: >-
    Test-owned geometry and mailbox expectations use literal file/rank labels;
    they never derive a coordinate from a TDFA Sq value or bit position.
  actual_normalization: >-
    For observation only, enumerate each returned Sq or set bit and map it to a
    canonical square label through UTIL::Square. Compare the resulting unordered
    labelled set. This joint semantic observation does not assert which integer
    denotes any label while C-BB-006 is unresolved.
  raw_representation_exclusion: >-
    No DESIGNED record asserts an exact numeric Sq, a literal U64 mask, a1-LSB
    versus a8-LSB, rank-major versus file-major layout, or a numeric direction
    sign. Those representation expectations remain blocked by C-BB-006.
  directionality: >-
    Normalization is raw-to-logical observation only. It does not authorize
    reconstructing a canonical TDFA Move from a deduplicated logical tuple; the
    recursive-perft records remain blocked until that reverse adapter is approved.

external_contract_dependencies:
  - id: C-MOV-011
    use: observed all().size() gate, post-call len bound, and complete fitting populated-prefix/generated-Move decode without constructor-len or minimum-capacity assumptions
    status: APPROVED
  - id: C-MOV-012
    use: nullable empty move_info representation or required non-null nonempty result, followed by count-bounded populated-prefix/generated-Move decode
    status: APPROVED
  - id: C-UTL-001
    use: observation-only conversion of an actual Sq to a canonical square label
    status: TENTATIVE
  - id: C-BB-006
    use: owns the deliberately excluded exact numeric Sq and BitBoard orientation
    status: UNRESOLVED

public_only: &public_only
  required: false
  justification: null
  approvals: []

diagnostic_profiles:
  move_set: &diag_move_set >-
    Report test id, fixture/corpus id, canonical six-field FEN, side and template
    colour, fixed seed/case index when present, expected and actual sorted UCI
    sets, missing moves, unexpected moves, duplicates before set conversion,
    and the public position-state diff before/after the call.
  geometry: &diag_geometry >-
    Report test id, origin coordinate/index, colour, direction, friendly and
    enemy occupancy as both square lists and 64-bit hex, expected and actual
    normalized destination/attack square sets, the observed raw masks in hex
    without treating them as expected literals, and the first differing ray or
    delta.
  state: &diag_state >-
    Report test id, FEN, operation and move path, ply, full before/after public
    snapshots (64 PieceOn values, aggregate occupancies, side, castling rights,
    en-passant square, clocks, and ZKey), and the first differing field.
  perft: &diag_perft >-
    Report test id, source file checksum, physical line and stable row id, FEN,
    tier and depth, expected/actual node counts as unsigned 64-bit values, a
    sorted root divide of UCI move to child count, duplicates, and root-state
    diff. Continue enough rows to show whether a failure is isolated, capped at
    20 detailed mismatches plus totals by depth.
  blocked: &diag_blocked >-
    Report the unresolved decision id, exact proposed fixture and observation,
    and why no expectation was asserted. A blocked test must not inspect TDFA
    output to choose among the unresolved options.

