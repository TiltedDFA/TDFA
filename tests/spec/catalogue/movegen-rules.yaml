mutant_classes:
  - {id: M-GEO-EDGE-WRAP, description: "leaper or slider wraps across a file/rank edge"}
  - {id: M-GEO-DELTA, description: "one king/knight delta is added, omitted, or transposed"}
  - {id: M-SLIDE-PASS, description: "slider passes through the first blocker"}
  - {id: M-SLIDE-CAPTURE, description: "enemy blocker omitted or friendly blocker emitted as a move"}
  - {id: M-SLIDE-RAY, description: "rank/file/diagonal/anti-diagonal lookup is crossed"}
  - {id: M-GEN-SOURCE, description: "generated move has the wrong source square or move kind"}
  - {id: M-GEN-DUPLICATE, description: "a logical move is emitted more than once"}
  - {id: M-GEN-COLOUR, description: "generator uses the other side or ignores aligned side-to-move"}
  - {id: M-PAWN-DIRECTION, description: "pawn forward/attack direction or rank orientation is reversed"}
  - {id: M-PAWN-DOUBLE-RANK, description: "double push is allowed away from or denied on the home rank"}
  - {id: M-PAWN-DOUBLE-BLOCK, description: "double push jumps an occupied intermediate square"}
  - {id: M-PAWN-CAPTURE, description: "pawn captures forward or moves diagonally without capture"}
  - {id: M-ATTACK-PAWN-MOVE, description: "pawn forward moves contaminate its attack map"}
  - {id: M-ATTACK-DEFENDED, description: "friendly-occupied defended square is omitted or mishandled"}
  - {id: M-ATTACK-PINNED, description: "own-king pin incorrectly removes a piece's standard attacks"}
  - {id: M-CHECK-SIDE, description: "check is computed for the wrong king or colour"}
  - {id: M-LEGAL-PIN, description: "a move exposing the moving king survives legal filtering"}
  - {id: M-LEGAL-EVASION, description: "non-evasion survives check or a valid evasion is removed"}
  - {id: M-LEGAL-DOUBLE, description: "a non-king move survives a genuine double check"}
  - {id: M-KING-DANGER, description: "king may enter attack, capture a defended piece, or become adjacent"}
  - {id: M-EP-OMIT, description: "a valid en-passant move is omitted"}
  - {id: M-EP-CAPTURE-SQUARE, description: "en passant removes the target square or wrong pawn"}
  - {id: M-EP-KING-SAFETY, description: "en-passant occupancy changes are ignored for king safety"}
  - {id: M-CASTLE-RIGHTS, description: "castling ignores or misdecodes a rights bit"}
  - {id: M-CASTLE-BLOCK, description: "castling crosses an occupied required-empty square"}
  - {id: M-CASTLE-CHECK, description: "castling is allowed from, through, or into check"}
  - {id: M-CASTLE-ROOK, description: "wrong/missing rook is used or rook lands on wrong square"}
  - {id: M-PROMO-CHOICES, description: "one logical promotion choice is missing or mislabelled"}
  - {id: M-PROMO-NONPROM, description: "an unpromoted last-rank pawn move is emitted"}
  - {id: M-STATE-LEAK, description: "a query or unmake changes piece placement or side"}
  - {id: M-STATE-METADATA, description: "rights, EP, clocks, hash, or nested history are updated or restored incorrectly"}
  - {id: M-UNMAKE-SPECIAL, description: "capture, EP, castle, or promotion is not exactly reversed"}
  - {id: M-PERFT-BASE, description: "depth-zero/base-depth count is off by one"}
  - {id: M-PERFT-RECURSE, description: "recursion uses pseudo-legal moves, wrong colour, or misses unmake"}
  - {id: M-PERFT-PARSER, description: "EPD parser skips a row, depth, or final semicolon field"}
  - {id: M-PERFT-WIDTH, description: "aggregate count uses insufficient integer width"}
  - {id: M-ORACLE-ORDER, description: "a differential compares list order instead of logical set"}
  - {id: M-RULE-TERMINAL, description: "checkmate and stalemate are confused"}
  - {id: M-RULE-DRAW, description: "claimable and automatic draw thresholds are conflated"}
  - {id: M-MIRROR, description: "white/black or file/rank symmetry is broken"}

tests:
  - id: T-GEO-001
    snapshot: *snapshot
    title: Exhaustive knight geometry on all origins
    status: DESIGNED
    contracts: [C-GEN-001]
    symbols:
      - consteval std::array<BitBoard, 64> Magics::KnightAttackingMask()
      - template<Colour colour_to_move> constexpr void MoveGen::KnightMoves(Position const*, MoveList*)
    categories: [positive, boundary, exhaustive, differential]
    setup: >-
      Use every one of the 64 origin squares. The mask layer has no pieces or
      occupancy. The generator integration layer uses a fresh list and a
      oracle/legal-shell-builder-v1 to place one knight and the two kings.
    action: >-
      Normalize each geometry mask and decoded generator destination to labelled
      squares, then compare with the signed-(1,2) coordinate model. For the
      generator layer, remove every target occupied by a friendly shell piece
      before comparison; retain an enemy-occupied target as a capture.
    expected: >-
      The normalized mask equals the complete geometric set for all 64 origins.
      The generator set equals that geometric set minus friendly-occupied
      targets, so a shell king on a knight target is never expected as a move.
      Corner cardinality is 2, non-corner edge cardinality is 3 or 4 as fixed by
      the model, and interior cardinality is at most 8. No destination wraps or
      contains the origin; no exact numeric Sq or U64 mask is asserted.
    oracle:
      type: exhaustive-model
      id: oracle/board-geometry-v1
      provenance: closed-form model embedded above; 64 finite origins
      independence_argument: production masks and shifts are not used
    diagnostics: *diag_geometry
    private_access: *public_only
    implementation: {files: [], test_names: []}
    mutants: [M-GEO-EDGE-WRAP, M-GEO-DELTA, M-GEN-SOURCE, M-MIRROR]
    author: *author
    reviewers: []
    findings: []

  - id: T-GEO-002
    snapshot: *snapshot
    title: Exhaustive king step geometry on all origins
    status: DESIGNED
    contracts: [C-GEN-001]
    symbols:
      - consteval std::array<BitBoard, 64> Magics::KingAttackingMask()
      - template<Colour colour_to_move> void MoveGen::KingMoves(Position const*, MoveList*)
    categories: [positive, boundary, exhaustive, differential]
    setup: >-
      Use all 64 origins in the geometry layer and legal single-king placements
      for both moving colours. For each labelled origin, scan a1,b1,...,h8 and
      place the opposing king on the first square whose Chebyshev distance from
      the origin is at least three. This keeps the opposing king and every square
      it attacks outside the moving king's one-step destination set.
    action: >-
      Normalize the geometry/destination sets to labels and compare with every
      in-board nonzero coordinate delta from {-1,0,1} squared. Castling is
      excluded from this step model.
    expected: >-
      Exact equality for 64 origins: 3 targets at a corner, 5 at a non-corner
      edge, and 8 in the interior; no wrapping, origin, or castling target. The
      deterministic opposing king removes no expected step, and no exact numeric
      Sq or U64 mask is asserted.
    oracle:
      type: exhaustive-model
      id: oracle/board-geometry-v1
      provenance: closed-form model embedded above; 64 finite origins
      independence_argument: production masks and shifts are not used
    diagnostics: *diag_geometry
    private_access: *public_only
    implementation: {files: [], test_names: []}
    mutants: [M-GEO-EDGE-WRAP, M-GEO-DELTA, M-GEN-SOURCE]
    author: *author
    reviewers: []
    findings: []

  - id: T-GEO-003
    snapshot: *snapshot
    title: Exhaustive ternary blocker geometry for every sliding line
    status: DESIGNED
    contracts: [C-GEN-001]
    symbols:
      - template<AttackDirection direction> constexpr move_info const* MoveGen::GetMovesForSliding(Sq, BitBoard, BitBoard)
      - move_info::count_
      - move_info::encoded_move_
      - Moves::DecodeMove
      - UTIL::Square
    categories: [positive, boundary, exhaustive, differential]
    setup: >-
      For every origin and each of File, Rank, Diagonal, and AntiDiagonal,
      enumerate empty/friendly/enemy assignment for every other square on that
      complete line, with the origin treated as the moving friendly piece and
      all off-line squares empty. This is 139968 rank, 139968 file, 31712
      diagonal, and 31712 anti-diagonal cases: 343360 total.
    action: >-
      Derive the direct two-ray expected set before the call. If it is nonempty,
      require the returned pointer non-null; if empty, accept null as the empty
      representation. For every non-null return, read count_, require
      count_<=encoded_move_.size(), and only then decode indices [0,count_) and
      compare the normalized logical destinations with that expected set.
      For the all-empty line case and every case with exactly one friendly or
      enemy line blocker, toggle each off-line square once as friendly and once
      as enemy to prove line locality. Do not assert move order, multiplicity,
      unused storage, pointer lifetime after observation, or attacks_ here.
    expected: >-
      A nonempty expectation has a non-null result; an empty expectation may be
      null or a non-null record with count_==0. Every non-null result passes its
      count bound. The checked prefix completely emits empty squares until the
      first blocker in each ray; the first enemy blocker is also emitted, the
      first friendly blocker is not, and no square beyond either blocker or
      outside the selected line is emitted.
    oracle:
      type: exhaustive-model
      id: oracle/board-geometry-v1
