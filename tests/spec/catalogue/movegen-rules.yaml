oracle_models:
  - id: oracle/board-geometry-v1
    definition: >-
      Files and ranks are integer coordinates 0..7. Knight deltas are every
      signed permutation of (1,2); king deltas are the eight nonzero pairs in
      {-1,0,1}; out-of-range targets are discarded. A sliding ray advances one
      coordinate step until the edge or first occupied square; an enemy first
      blocker is a move destination and a friendly first blocker is not.
    independence: >-
      Expected labelled squares come from closed-form coordinate arithmetic; no
      production masks, lookup tables, shifts, encoders, or move generators are
      reused. TDFA Sq and BitBoard results are normalized only after observation
      as specified by square_observation_policy.
  - id: oracle/mailbox-legal-v1
    definition: >-
      A test-owned 8x8 mailbox reference enumerates piece-rule destinations,
      clones the mailbox, applies captures and special moves logically, and
      rejects a move exactly when the moving side's king is attacked afterward.
      Castling separately checks rights, conventional king and rook placement,
      empty path, and unattacked start/transit/destination. It returns logical
      source/target/promotion tuples and never TDFA Move values. Promotion is a
      logical choice in {q,r,b,n}, not a PieceType representation or numeric
      MoveType range.
    independence: >-
      The implementation must be written from this rule description, contain no
      production headers beyond a thin translation adapter, and receive an
      independent review before any dependent expectation is frozen.
  - id: oracle/attack-nondisputed-consensus-mask-v1
    definition: >-
      From the same labelled reference board, enumerate the allowed direct-
      attack convention variants for friendly-occupied defended squares,
      absolutely pinned attackers, and king-neighbour squares the king cannot
      legally enter. Let I be the intersection of all variant attack sets and U
      their union. The consensus assertion mask is I union complement(U), and
      a direct attack result A passes exactly when A intersect mask equals I.
      Pawn variants use diagonals rather than forward moves, slider variants
      stop beyond the first blocker, and king variants never add castling.
    independence: >-
      Every variant is calculated by labelled coordinate/reference-board rules;
      no TDFA attack function, mask, lookup, or observed result selects I, U, or
      the consensus mask.
  - id: oracle/fide-check-v1
    definition: >-
      InCheck is true exactly when the active side's king square is attacked by
      the opponent under FIDE Article 3.1.3. An opposing piece still attacks for
      this predicate when it is constrained from moving because moving would
      leave or place its own king under attack; no consensus mask is applied.
    independence: Exact labelled mailbox attack evaluation independent of TDFA.
  - id: oracle/legal-shell-builder-v1
    definition: >-
      Given an exact non-king placement and aligned side, enumerate ordered White
      king then Black king square pairs in a1..h8 order. Select the first pair
      that is distinct, nonadjacent, does not overlap another piece, leaves
      neither king attacked in the mailbox model, and satisfies ordinary pawn
      rank/king-count structure. Failure to find a pair blocks that generated
      case instead of manufacturing private state.
    independence: Placement selection uses only the test mailbox attack model.

