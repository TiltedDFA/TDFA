    purpose: >-
      Compute the selected colour's named-constant material contribution as an
      additive quantity independent of opponent material.
    authority:
      type: mathematical
      reference: oracle/selected-colour-named-material-differences-v3
    preconditions:
      - "Every exact canonical FEN passes semantic_fixture_validation_v3 through approved C-FEN-010 and C-BRD-010 before CountMaterial is called."
      - "The Position pointer is non-null, the template colour is White or Black, and fixtures contain only ordinary pieces."
      - "Every arithmetic equation uses widened_material_arithmetic_v3."
    result:
      - "Relative to the same selected-colour two-king baseline, adding one selected pawn, knight, bishop, rook, or queen changes CountMaterial by its corresponding named Eval constant."
      - "Adding the five disjoint selected-colour valued pieces changes CountMaterial by their exact widened named-constant sum."
      - "Changing only opponent non-king pieces leaves the selected colour's CountMaterial result unchanged."
    mutates:
      - "Caller-visible mutation behavior is unspecified; this card observes only return arithmetic."
    preserves:
      - "No Position-preservation result is added by this card."
    failure:
      - "Baseline zero, king value, literal weights, colour/square symmetry, malformed setup, and arithmetic without the widening proof are outside this card."
      - "Mobility, PawnProgress, UpdateData, phase/global behavior, and Evaluate composition are outside this card."
    ordering: "Contributions are an exact mathematical sum; production enumeration order is unspecified."
    determinism: "Deterministic for the selected colour and validated semantic fixture."
