schema_version: 1
packet_version: 3
snapshot: 6ea2c5c04bc83b7be7633936c53851154b7203669505af50a6095531a38be592
contract_set: runtime-math
authoring_stage: implementation-blind-contract-authoring

information_firewall:
  permitted_inputs:
    - tests/spec/api-dossier.md
    - tests/spec/intended-purpose-v1.md
    - candidate semantic cards from tests/spec/contracts/external-math.yaml, usable only after their required independent approval
    - tests/data/oracle_cases.tsv
    - tests/data/oracle_perft.tsv
    - v2 runtime-math packet and the consolidated findings from both independent REJECT reviews
    - final dependency hashes and previously named blocker ids only; no production behavior imported
  implementation_bodies_inspected: false
  source_tree_inspected: false
  cpp_tests_inspected: false
  product_executed: false
  external_material_fetched: false

independent_reject_reviews:
  - reviewer: /root/app_review_d
    disposition: REJECT
    persisted_document: false
    incorporated: unauthorized TT allocation assumptions, semantic setup dependencies, state scope, diagnostics, and mutant honesty
  - reviewer: /root/runtime_review_b
    disposition: REJECT
    persisted_document: false
    incorporated: TT vacuity, Evaluate perspective separation, perft replacement/reset sequencing, and digest/dependency rigor

scope: >-
  Version 3 specifies only fresh zero-capacity TT ownership, selected-colour
  material arithmetic, Evaluate repeatability and public FEN-semantic purity,
  frozen bulk-perft count replacement, and ResetData's node reset. Allocated TT,
  evaluation perspective, hash/history purity, Search, and TimeManager remain
  explicit non-executable blockers. No author approves a card in this packet.

required_semantic_dependencies:
  - id: C-MOV-010
    version: 1
    required_status: APPROVED
    observed_status_at_pin: APPROVED
    use: valid opaque Move payload for the blocked allocated-TT candidate only
  - id: C-BRD-010
    version: 5
    required_status: APPROVED
    observed_status_at_pin: APPROVED
    use: labelled placement plus colour/type occupancy construction and observation
  - id: C-FEN-010
    version: 5
    required_status: APPROVED
    observed_status_at_pin: APPROVED
    use: canonical legal Position construction and public six-field FEN semantics

shared_definitions:
  full_public_fen_semantic_snapshot_v3:
    fields:
      - PieceOn semantic identity on every labelled square through C-BRD-010
      - Pieces occupancy by White and Black and by each ordinary colour/type pair through C-BRD-010
      - active side through ColourToMove
      - named castling-right set through CastlingRights
      - semantic en-passant target, observing absence only as EnPasBB equal to zero and presence through EnPasBB plus EnPasSq
      - HalfMoves and FullMoves
    exclusions:
      - raw ZKey and HashCurrentPostion
      - private previous_state_info, repetition history, caches, padding, and object address
      - numeric square orientation, numeric piece encoding, and numeric castling-bit layout

  semantic_fixture_validation_v3: >-
    Before a runtime assertion, construct the exact canonical FEN through
    C-FEN-010 and validate its observable semantics. Compare PieceOn on all 64
    labelled squares and every colour/type Pieces projection with the independently
    decoded FEN placement under C-BRD-010; compare active side, named rights,
    semantic en-passant target or absence, and both counters under C-FEN-010; and
    require the card's positive-domain IsOk result. A failed validation is a named
    setup/dependency failure and the runtime operation is not called on that fixture.

  widened_material_arithmetic_v3: >-
    Every CountMaterial result and named Score constant is converted before
    arithmetic to W=std::intmax_t. The harness statically proves with
    numeric_limits that W is signed and has at least three more value bits than
    Score, enough for a difference of two Score values and a sum of five Score
    values. No expected sum is formed in Score and no value is narrowed to Score.
    A target that cannot satisfy the proof cannot implement the DESIGNED record.

  diagnostic_capture_v3:
    per_stream_byte_limit: 65536
    required_fields:
      - stream name
      - captured byte count
      - truncated true or false
      - omitted byte count when known
    rule: >-
      Any omitted byte requires truncated=true. A stream that exactly reaches
      the limit may report truncated=false only when end-of-stream proves that no
      byte was omitted. A sanitizer pass requires truncated=false; truncated
      sanitizer output is an infrastructure failure, never evidence that no
      diagnostic occurred.

  default_tt_sanitizer_isolation_v3:
    profile: linux-clang-address
    instrumentation: Clang AddressSanitizer
    isolation: one fresh child process for the unallocated default lifecycle
    success: normal exit, no AddressSanitizer diagnostic, and diagnostic_capture_v3 truncated=false
    nonclaims:
      - no allocated-storage or leak observation
      - no Resize, Store, Probe, or Clear observation

  unavailable_positive_tt_precondition_v3: >-
    No approved numeric Resize request, unit conversion, minimum allocation rule,
    allocator seam, or public postcondition can establish a nonzero GetNumElems
    table in this snapshot. Observing zero and skipping would be vacuous. Therefore
    allocated lifecycle, Store/Probe/Clear, replacement-storage, and allocated
    destructor/leak expectations are non-executable until D-TT-001 is resolved.

open_decision_context:
  D-TT-001: >-
    Approve a non-vacuous way to establish positive table capacity, including
    request units/minimum behavior or an owner-approved test seam.
  D-EVAL-001: >-
    Approve the side-to-move score relation, including whether an active-side
    swap negates, preserves, or otherwise transforms Evaluate.
  D-POS-002: >-
    Approve cached hash mutation/equality and the observable history dimensions;
    no private history access is granted by this packet.
  D-TIME-001: >-
    Approve a controllable monotonic clock seam plus allowance, overflow, and
    deadline-comparison rules.
  D-SRCH-004: >-
    Approve deterministic finite completion for FindBestMove.

cards:
  - id: C-RTM-TT-001
    snapshot: 6ea2c5c04bc83b7be7633936c53851154b7203669505af50a6095531a38be592
    version: 3
    status: TENTATIVE
    kind: internal
    signatures:
      - "TransposTable::TransposTable()"
      - "TransposTable::~TransposTable()"
      - "[[nodiscard]] size_t TransposTable::GetNumElems() const"
    purpose: >-
      Construct and destroy the default table owner while exposing its initial
      absence of allocated cache capacity.
    authority:
      type: mathematical
      reference: oracle/empty-owner-lifecycle-v3
    preconditions:
      - "Use a fresh table and never call Resize, Store, Probe, or Clear."
      - "Use one thread and do not copy or move the table."
      - "The destructor observation runs under default_tt_sanitizer_isolation_v3."
    result:
      - "Fresh GetNumElems equals zero and a repeated observation still equals zero."
      - "The fresh unallocated table leaves scope exactly once, the child exits normally, and AddressSanitizer reports no invalid lifetime operation."
    mutates:
      - "Construction initializes and destruction ends only the target table lifetime."
    preserves:
      - "GetNumElems is observational for the fresh table."
      - "Every object outside the target table."
    failure:
      - "Any allocated-storage, leak, Resize, Store, Probe, Clear, pointer, copy/move, concurrency, or failure-path behavior is outside this card."
    ordering: "Construct, observe GetNumElems twice, then destroy once."
    determinism: "The two zero-capacity observations and default lifetime result are deterministic under the named sanitizer profile."
    oracle:
      type: reference-model
      id: oracle/empty-owner-lifecycle-v3
    open_decisions: []
    review:
      author: blind-contract-author-runtime-math-v3
      approvers: []
      approved_at: null

