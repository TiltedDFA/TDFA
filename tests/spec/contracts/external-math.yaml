    preserves:
      - "All by-value operands and all state unrelated to the PopNRetLS1B operand."
    failure:
      - "Zero scans/removals and out-of-range square indices are outside this card; no failure response is specified."
    ordering: not applicable
    determinism: "Deterministic for the stated inputs."
