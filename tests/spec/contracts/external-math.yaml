    C-MOV-012: [T-GEO-003]
    C-UCI-010: [T-MOV-004, T-UTL-001, T-STA-001, T-STA-003, T-STA-004, T-ATK-001, T-ATK-002, T-ATK-003, T-STATE-002, T-ORACLE-003]
    C-BRD-010: [T-BRD-001, T-BRD-002, T-BRD-003, T-BRD-004, T-BRD-005, T-BRD-007, T-FEN-001, T-POS-002, T-STA-001, T-STA-003, T-STA-004, T-ATK-001, T-ATK-002, T-ATK-003, T-STATE-001, T-STATE-002, T-RULE-001, T-RULE-003, T-RULE-006, T-ORACLE-003]
    C-FEN-010: [T-MOV-004, T-FEN-001, T-FEN-003, T-POS-002, T-POS-003, T-STA-001, T-STA-003, T-STA-004, T-ATK-001, T-ATK-002, T-ATK-003, T-RULE-007, T-STATE-001, T-STATE-002, T-RULE-001, T-RULE-003, T-RULE-006, T-ORACLE-002, T-ORACLE-003]
    C-FEN-011: [T-LEX-001, T-LEX-002]
    C-CHS-010: [T-GEO-001, T-GEO-002, T-GEO-003, T-GEO-004, T-GEN-001, T-GEN-002, T-GEN-003, T-LEGAL-001, T-LEGAL-002, T-LEGAL-003, T-LEGAL-004, T-LEGAL-005, T-RULE-001, T-RULE-002, T-RULE-003, T-RULE-004, T-RULE-006, T-RULE-007, T-STATE-001, T-STATE-002, T-ORACLE-002, T-ORACLE-003]
    C-ATK-010: [T-ATK-001, T-ATK-002, T-ATK-003, T-LEGAL-005, T-RULE-007, T-STATE-001, T-ORACLE-002, T-ORACLE-003]
    C-ATK-011: [T-RULE-007]
    C-CHS-011: [T-STA-001, T-STA-003, T-STA-004, T-RULE-001, T-RULE-003, T-RULE-006, T-STATE-002, T-ORACLE-003]
  dependency_trace:
    literal_transition_records:
      tests: [T-STA-003, T-STA-004]
      literal_token_to_semantic_move: [C-UCI-010, C-MOV-010]
      exact_transition: C-CHS-011
      post_transition_observers: [C-BRD-010, C-FEN-010]
      binding: >-
        At each current legal prefix, UciToMove receives the frozen literal UCI
        token, DecodeMove verifies that token's exact source, target, and named
        MoveType, and MakeMove applies that exact returned Move before the
        declared public snapshot is observed.
    direct_attack_records:
      tests: [T-ATK-001, T-ATK-002, T-ATK-003]
      fen_construction: C-FEN-010
      public_snapshot: [C-BRD-010, C-FEN-010]
      raw_square_normalization: C-UCI-010
      direct_attack_and_check: C-ATK-010
      binding: >-
        Each legal Position is constructed from its literal FEN, its complete
        semantic snapshot is captured through Board and Position observers, and
        actual Sq/set-bit observations are converted to labels only through
        UTIL::Square. Expected labelled geometry is independently derived.
    terminal_classification_record:
      tests: [T-RULE-007]
      equivalent_fen_positions: C-FEN-010
      unmasked_check: C-ATK-010
      fitting_legal_generation: [C-CHS-010, C-MOV-011]
      classification: C-ATK-011
      binding: >-
        The check query and legal generation use separate equivalent fresh
        Positions. The expected legal set is fixed before list construction;
        all().size() gates the generation call and len() is bounded before its
        emptiness participates in the standard terminal classification.
    special_move_generation_and_transition:
      tests: [T-RULE-001, T-RULE-003, T-RULE-006]
      generation_position: [C-CHS-010, C-MOV-011, C-MOV-010]
      separate_equivalent_transition_position: [C-CHS-011, C-BRD-010, C-FEN-010]
      binding: >-
        Each decoded generated Move is retained from a dedicated fresh
        generation Position and applied only to a separately established
        equivalent Position; no post-GenerateLegalMoves state is reused.
    generated_transition_exhaustion:
      tests: [T-STATE-002]
      fitting_generation: [C-FEN-010, C-CHS-010, C-MOV-011, C-MOV-010]
      fresh_equivalent_transition_per_prefix_entry: [C-FEN-010, C-CHS-011]
      transition_observers: [C-BRD-010, C-FEN-010, C-UCI-010]
      binding: >-
        After the expected set fits and the populated prefix passes its len
        bound, every retained Move is applied only to its own fresh equivalent
        transition Position. The dedicated generation Position is never made
        upon, and duplicate entries if present are checked independently without
        selecting one as canonical or asserting multiplicity.
    T-ORACLE-003:
      root_and_expected_positions: C-FEN-010
      legal_token_to_move_adapter: C-UCI-010
      replay_transition: C-CHS-011
      replay_public_observations_before_generation: [C-BRD-010, C-FEN-010, C-ATK-010]
      separate_terminal_generation_position: [C-FEN-010, C-CHS-010]
      populated_legal_set_projection: C-MOV-011
      binding: >-
        The catalogue's approved legal move adapter is bound here to
        UciToMove on the current legal Position followed by MakeMove of that
        exact Move. Final placement, side, and InCheck are observed on the replay
        Position before any terminal GenerateLegalMoves call; the legal set is
        generated on a fresh Position imported from the same final row FEN. No
        GenerateLegalMoves restoration or unlisted adapter semantic is assumed.
  designed_requiring_split_or_block:
    - tests: [T-BB-007]
      disposition: CANDIDATE_BLOCKED
      reason: >-
        The exact numeric-index geometry chooses an internal square orientation,
        which this batch excludes pending D-TYP-001/C-BB-006.
    - tests: [T-HSH-001, T-HSH-002]
      disposition: CANDIDATE_BLOCKED
      reason: >-
        Hash refresh mutation, component set, and draw/history-sensitive identity
        are owner policy under D-POS-002 and D-TT-006; T-HSH-002 additionally
        depends on the restoration boundary in D-POS-005.
    - tests: [T-ORACLE-001, T-PERFT-001, T-PERFT-003]
      disposition: CANDIDATE_INFRASTRUCTURE
      reason: >-
        These own test-fixture bytes, scoped digests, row counts, and loader
        behavior rather than a TDFA declaration or application command. No
        behavioral consumer independently reasserts a byte-frozen row count.
  deliberate_exclusions:
    - invalid, malformed, null, sentinel, overflow, and resource-failure inputs
    - raw Move/Piece/enum numeric layouts and numeric-to-UCI square orientation
    - MoveList/move_info unused storage, ordering, multiplicity, nonfresh append/replace, minimum capacity, constructor len, oversized-result, and overflow policy beyond C-MOV-011/C-MOV-012's observed-capacity and checked-prefix projections
    - repeated PieceType pack arguments, pt_All inside a variadic pack, and sentinel Board queries outside C-BRD-010's distinct ordinary-type-pack and single aggregate-query domains
    - automatic ZKey lifecycle, Zobrist component set, collision claims, and draw/history identity
    - post-generation hash, cache, and hidden-history lifecycle beyond C-CHS-010's complete FEN-semantic restoration guarantee
    - broad or nested UnmakeMove restoration beyond the stated placement-and-side projection
    - disputed friendly-occupied, pinned-piece, and king-legality direct attack-map equality outside C-ATK-010's assertion mask; InCheck itself has no such exclusion
    - default Position/StateInfo/Reset state and copy/move ownership
    - draw adjudication and any application/search outcome not bound to a declared observable
  fixture_hash_scope:
