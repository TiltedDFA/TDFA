  - id: C-BRD-010
    snapshot: 6ea2c5c04bc83b7be7633936c53851154b7203669505af50a6095531a38be592
    version: 5
    status: APPROVED
    kind: mathematical
    signatures:
      - "constexpr Board::Board()"
      - "constexpr void Board::ResetBoard()"
      - "constexpr BitBoard Board::Pieces(const PieceType pt) const"
      - "constexpr BitBoard Board::Pieces(const Colour c) const"
      - "constexpr BitBoard Board::Pieces(Colour, Colour) const"
      - "template<typename... PieceTypes> constexpr BitBoard Board::Pieces(const PieceType p, PieceTypes... pt) const"
      - "template<typename... PieceTypes> constexpr BitBoard Board::Pieces(const Colour c, PieceTypes... p) const"
      - "constexpr Piece Board::PieceOn(const Sq s) const"
      - "static constexpr Piece Board::MakePiece(const Colour c, const PieceType t)"
      - "constexpr PieceType Magics::TypeOf(Piece p)"
      - "constexpr Colour Magics::ColourOf(Piece p)"
      - "constexpr void Board::AddPiece(const Piece p, const Sq s)"
      - "constexpr void Board::RemovePiece(const Sq s)"
      - "constexpr Piece Board::PopPiece(const Sq s)"
      - "constexpr void Board::MovePiece(const Sq from, const Sq to)"
    purpose: >-
      Model a board as a finite partial map from 64 square keys to the twelve
      ordinary colour-piece pairs and expose its valid primitive transitions.
    authority:
      type: mathematical
      reference: oracle/finite-piece-map-v1
    preconditions:
      - "Colours are White or Black, ordinary piece types are King, Queen, Bishop, Knight, Rook, and Pawn, pieces are the twelve corresponding Piece enumerators, and squares are in 0..63."
      - "The single-argument Pieces(PieceType) query accepts each ordinary type and the aggregate category pt_All; MakePiece, TypeOf, and every variadic type pack use only ordinary types."
      - "Piece-type packs are nonempty, contain only ordinary PieceTypes, and do not repeat a type."
      - "The two-colour overload is called only as Pieces(White,Black) or Pieces(Black,White)."
      - "AddPiece targets an empty square; RemovePiece and PopPiece target an occupied square; MovePiece has an occupied source and a distinct empty target."
    result:
      - "Construction and ResetBoard produce the empty map; repeated reset is idempotent."
      - "MakePiece is a bijection on the two-colour by six-type product, with TypeOf and ColourOf as its inverse projections."
      - "PieceOn returns the mapped piece or p_None."
      - "Pieces(colour) is exactly the set of squares mapped to a piece of that colour."
      - "Pieces(pt_All) is exactly every occupied square, equal to Pieces(White) union Pieces(Black) and to the union of the six ordinary single-type queries."
      - "Pieces(type...) is the union of squares whose piece type is in the supplied distinct-type pack; argument order does not change that set."
      - "Pieces(colour,type...) intersects that type union with the supplied colour, while Pieces(White,Black) and Pieces(Black,White) return the union of both colour occupancies."
      - "Add, remove, pop, and move perform exactly the corresponding finite-map operation; PopPiece returns the removed piece."
    mutates:
      - "ResetBoard, AddPiece, RemovePiece, PopPiece, and MovePiece may mutate only the target Board according to the stated map transition."
    preserves:
      - "Every unrelated square and its colour/type membership."
    failure:
      - "Sentinels (including pt_None), invalid squares/pieces/types, pt_All inside a variadic type pack, repeated piece-type arguments, same-colour calls to the two-colour overload, occupied add/target, empty source/removal, and equal move endpoints are outside this card; no failure response is specified."
    ordering: not applicable
    determinism: "Deterministic for the stated Board and inputs."
    oracle:
      type: exhaustive-model
      id: oracle/finite-piece-map-v1
    open_decisions: []
    review:
      author: blind-contract-author
      approvers: ["/root/app_review_d", "/root/external_rereview_c"]
      approved_at: "2026-07-22"

  - id: C-FEN-010
    snapshot: 6ea2c5c04bc83b7be7633936c53851154b7203669505af50a6095531a38be592
    version: 5
    status: APPROVED
    kind: internal
    signatures:
      - "Position::Position(std::string_view fen)"
      - "void Position::ImportFen(std::string_view fen)"
      - "constexpr BitBoard Position::EmptySqs() const"
      - "constexpr BitBoard Position::EnPasBB() const"
      - "constexpr Sq Position::EnPasSq() const"
      - "constexpr U8 Position::CastlingRights() const"
      - "constexpr Colour Position::ColourToMove() const"
      - "constexpr U8 Position::HalfMoves() const"
      - "constexpr U16 Position::FullMoves() const"
      - "bool Position::IsOk() const"
    purpose: >-
      Establish an independently legal searchable Position from canonical FEN
      and expose its FEN-semantic fields after direct import or an independently
      approved legal transition.
    authority:
      type: FEN
      reference: >-
        PGN/FEN specification section 16.1 at
        https://www.saremba.de/chessgml/standards/pgn/pgn-complete.htm and
        tests/spec/intended-purpose-v1.md Position/FEN observer rows
    preconditions:
      - >-
        Position construction and ImportFen receive a canonical structurally
        valid, independently FIDE-legal and searchable six-field FEN whose
        counters fit the declared observer return types.
      - >-
        Position observers are called either on a Position established by such
        construction/import or after this explicit approved transition chain:
        on the current legal Position, UTIL::UciToMove under C-UCI-010 converts
        a frozen literal legal UCI token, Moves::DecodeMove under C-MOV-010
        verifies its exact semantic Move tuple, then Position::MakeMove under
        C-CHS-011 applies that exact returned Move. A sequence repeats the same
        chain at each current prefix.
      - "EnPasSq is observed only when the FEN contains an en-passant target; absence is observed only through EnPasBB()==0."
    result:
      - "Construction and ImportFen establish exactly the labelled piece map, active colour, named castling-right set, en-passant target, halfmove clock, and fullmove number encoded by the FEN."
      - "ImportFen replaces those semantic fields rather than merging them, and repeated import is idempotent over those fields."
      - "EmptySqs is the complement of occupied labelled squares; EnPasBB is the target singleton when present; the other observers return their corresponding current FEN-semantic field regardless of whether provenance was direct import or the UTIL::UciToMove/Moves::DecodeMove/Position::MakeMove chain governed by C-UCI-010, C-MOV-010, and C-CHS-011."
      - "IsOk returns true for every independently legal searchable Position in this positive domain."
    mutates:
      - "Construction and ImportFen may replace only the target Position; this card makes no assertion about hash or history lifecycle."
      - "EmptySqs, EnPasBB, EnPasSq, CastlingRights, ColourToMove, HalfMoves, FullMoves, and IsOk do not mutate any FEN-semantic field named in this card."
    preserves:
      - "The input FEN bytes and all unrelated objects."
      - "Every Position observer and IsOk preserve the labelled piece map, active colour, named rights, en-passant target, and both clocks; hash, cache, and history internals remain outside this card."
    failure:
      - "Noncanonical, malformed, structurally invalid, FIDE-illegal, non-searchable, out-of-range FEN, negative IsOk classification, and absent EnPasSq sentinel behavior are outside this card; no failure response is specified."
    ordering: "FEN fields are placement, active colour, castling, en-passant, halfmove, then fullmove; all set-valued observations are otherwise unordered."
    determinism: "Deterministic for the stated FEN."
    oracle:
      type: reference-model
      id: oracle/frozen-fen-semantic-snapshot-v1
