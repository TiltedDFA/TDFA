  - id: C-CHS-010
    snapshot: 6ea2c5c04bc83b7be7633936c53851154b7203669505af50a6095531a38be592
    version: 6
    status: APPROVED
    kind: internal
    signatures:
      - "constexpr void MoveGen::GenerateMovesFromBB(BitBoard b, MoveList* ml, const Sq from, const MoveType type)"
      - "template<AttackDirection direction> constexpr move_info const* MoveGen::GetMovesForSliding(Sq piece_sq, BitBoard us, BitBoard them) noexcept"
      - "void MoveGen::WhitePawnMoves(Position const* pos, MoveList* ml) noexcept"
      - "void MoveGen::BlackPawnMoves(Position const* pos, MoveList* ml) noexcept"
      - "template<Colour colour_to_move> constexpr void MoveGen::BishopMoves(Position const* pos, MoveList* ml)"
      - "template<Colour colour_to_move> constexpr void MoveGen::RookMoves(Position const* pos, MoveList* ml)"
      - "template<Colour colour_to_move> constexpr void MoveGen::QueenMoves(Position const* pos, MoveList* ml)"
      - "template<Colour colour_to_move> constexpr void MoveGen::KnightMoves(Position const* pos, MoveList* ml)"
      - "template<Colour colour_to_move> void MoveGen::KingMoves(Position const* pos, MoveList* ml)"
      - "template<Colour colour_to_move> constexpr void MoveGen::Castling(Position const* pos, MoveList* ml) noexcept"
      - "template<Colour colour_to_move> constexpr void MoveGen::GeneratePseudoLegalMoves(Position const* __restrict__ pos, MoveList* __restrict__ ml)"
      - "template<Colour colour_to_move> void MoveGen::GenerateLegalMoves(Position* __restrict__ pos, MoveList* __restrict__ ml)"
    purpose: >-
      Produce standard chess movement sets on valid aligned positions, observed
      only as logical source/target/promotion tuples, while leaving every
      supplied Position logically unchanged on return.
    authority:
      type: FIDE
      reference: >-
        https://handbook.fide.com/chapter/E012023 and
        tests/spec/intended-purpose-v1.md MoveGen rows, including the firm
        GenerateLegalMoves restoration intent
    preconditions:
      - "Every Position pointer is non-null and points to an independently legal searchable Position established under C-FEN-010; the template or named colour equals Position::ColourToMove()."
      - >-
        Before each MoveList-writing call, the test independently derives the
        complete expected logical set, constructs a dedicated MoveList, observes
        only all().size(), and calls the generator only when the expectation
        fits that observed capacity. Post-call prefix access follows C-MOV-011's
        len bound and decode checks; no constructor len or minimum capacity is
        assumed.
      - >-
        Immediately before every Position-taking generation call, the test
        captures the complete FEN-semantic snapshot through C-BRD-010 and
        C-FEN-010: labelled piece map, active colour, named castling rights,
        en-passant target or absence, halfmove clock, and fullmove number.
      - >-
        Each Position supplied to GenerateLegalMoves is a fresh instance
        dedicated to that one generation call. Transition assertions still use
        a separately established equivalent Position; the generation instance
        is observed after return only to verify the restoration result in this
        card and is never reused as transition provenance.
      - "GenerateMovesFromBB receives a valid source, a destination set excluding that source, and one of the eight concrete semantic MoveTypes in C-MOV-010."
      - "GetMovesForSliding receives a valid source contained in us, disjoint us/them occupancies, and one of the four named AttackDirection instantiations."
      - "Castling fixtures have conventional king/rook placement, internally consistent rights, and otherwise valid positions."
    result:
      - "Every fitting approved-domain MoveList result below is completely represented by the unordered logical set decoded from C-MOV-011's checked populated prefix; no raw backing storage, order, multiplicity, constructor len, or minimum capacity is asserted."
      - "GenerateMovesFromBB's logical set is exactly the product of the source and requested kind with every destination bit; it distributes over disjoint destination union."
      - "GetMovesForSliding first satisfies C-MOV-012's non-null and count-bounds results; its complete logical destinations are then decoded from the checked immediate move_info prefix and follow both rays to the edge or first blocker, including the first enemy blocker and excluding a friendly blocker and all squares beyond it."
      - "WhitePawnMoves, BlackPawnMoves, and the bishop, rook, queen, knight, and king generators return exactly their FIDE movement-rule destinations before general own-king-safety filtering, with ordinary capture, double-push, en-passant, and four promotion choices where applicable."
      - "Castling returns exactly each rights-authorized castle whose conventional king and rook are present, whose intervening path squares are empty, and whose king start, transit, and destination squares are unattacked; an attack only on the rook square or queen-side b-file clearance square does not bar castling."
      - "GeneratePseudoLegalMoves returns the union of all movement-rule moves, applying Castling's stated special prerequisites but otherwise preceding general own-king-safety filtering."
      - "GenerateLegalMoves returns exactly the moves legal under FIDE king-safety and special-move rules."
      - "Colour/rank-reflected valid positions have correspondingly reflected logical move sets."
      - >-
        On return from every Position-taking generator, including
        GenerateLegalMoves, the labelled piece map, active colour, named
        castling rights, en-passant target or absence, halfmove clock, and
        fullmove number exactly equal the pre-call snapshot.
    mutates:
      - "A MoveList-writing function may mutate only its supplied list's logical populated contents under C-MOV-011."
      - >-
        GenerateLegalMoves may transiently mutate its dedicated supplied
        Position while filtering moves, but must restore every FEN-semantic
        field named above before return. Hidden cache, hash, and history
        lifecycle remain outside this card.
    preserves:
      - "Every Position-taking generator preserves the supplied Position's complete FEN-semantic snapshot on return."
      - "All objects unrelated to the supplied Position and output list, including every separately established equivalent transition Position."
    failure:
      - "Null pointers, malformed/misaligned positions, invalid move components, nonfresh lists, and expected logical sets larger than the observed MoveList capacity are outside this card; no failure response is specified. A fitting incomplete or out-of-bounds list result, a nonempty move_info contract violation, or any post-return FEN-semantic state difference violates the result."
    ordering: explicitly unspecified
    determinism: "The logical set is deterministic for the stated Position and inputs."
    oracle:
      type: reference-model
      id: oracle/mailbox-legal-v1
    open_decisions: []
    review:
      author: blind-contract-author
      approvers: ["/root/app_review_d", "/root/external_rereview_c"]
      approved_at: "2026-07-22"

  - id: C-ATK-010
    snapshot: 6ea2c5c04bc83b7be7633936c53851154b7203669505af50a6095531a38be592
    version: 6
    status: APPROVED
    kind: internal
    signatures:
      - "template<Colour colour_to_move> constexpr BitBoard MoveGen::PawnAttacks(Position const* pos)"
      - "template<Colour colour_to_move> constexpr BitBoard MoveGen::KingAttacks(Position const* pos)"
      - "template<Colour colour_to_move> constexpr BitBoard MoveGen::KnightAttacks(Position const* pos)"
      - "template<Colour colour_to_move> constexpr BitBoard MoveGen::BishopAttacks(Position const* pos)"
      - "template<Colour colour_to_move> constexpr BitBoard MoveGen::RookAttacks(Position const* pos)"
      - "template<Colour colour_to_move> constexpr BitBoard MoveGen::QueenAttacks(Position const* pos)"
      - "template<Colour colour_to_move> BitBoard MoveGen::GenerateAllAttacks(Position const* pos)"
      - "template<Colour colour_to_move> bool MoveGen::InCheck(Position const* pos)"
    purpose: >-
      Fix unambiguous direct attack projections and check detection on valid
      positions without introducing a move-collection dependency.
    authority:
      type: FIDE
      reference: https://handbook.fide.com/chapter/E012023
    preconditions:
      - "Every Position pointer is non-null and points to an independently legal searchable Position constructed from canonical FEN under C-FEN-010; every direct attack or InCheck template colour equals Position::ColourToMove()."
      - >-
        Before each query, the test captures the complete FEN-semantic snapshot
        through C-BRD-010 and C-FEN-010. Any raw Sq or returned set bit used for
        comparison is normalized only by UTIL::Square under C-UCI-010; expected
        labelled squares are derived independently and never from that adapter.
      - >-
        Direct per-piece and aggregate attack-set equality uses
        oracle/attack-nondisputed-consensus-mask-v1. For the allowed convention
        variants, let I be their intersection and U their union; compare only on
        the consensus mask I union complement(U), with I as the expected true
        subset. That exclusion applies only to attack-map equality, never InCheck.
    result:
      - "After intersection with the assertion mask, pawn attacks are exactly the in-board forward diagonals, never forward moves."
      - "After the same intersection, leaper and slider membership follows labelled FIDE geometry, stops beyond the first blocker, and never adds castling to king attacks."
      - "After the same intersection, GenerateAllAttacks is the set union of the component projections; overlap never cancels."
      - >-
        InCheck follows oracle/fide-check-v1 without a mask and is true exactly
        when the active colour's king is attacked by the opponent under FIDE
        Article 3.1.3; attacks by an
        opponent piece constrained from moving because its own king would be
        exposed still count for this predicate.
    mutates:
      - "The direct attack and InCheck queries do not mutate any FEN-semantic field."
    preserves:
      - "PawnAttacks, KingAttacks, KnightAttacks, BishopAttacks, RookAttacks, QueenAttacks, GenerateAllAttacks, and InCheck preserve their supplied Position's labelled piece map, active colour, named rights, en-passant target, and both clocks."
      - "All unrelated objects and all test-owned expected labelled sets."
    failure:
      - "Null pointers, malformed positions, template mismatch, and exact attack-map membership on assertion-mask-excluded squares are outside this card; no failure response is specified. No assertion-mask exclusion weakens InCheck."
    ordering: "Attack results are sets with unspecified iteration order."
    determinism: "The asserted projection and check predicate are deterministic for the stated Position."
    oracle:
      type: reference-model
      id: oracle/attack-nondisputed-consensus-mask-v1+oracle/fide-check-v1
    open_decisions: []
    review:
      author: blind-contract-author
      approvers: ["/root/app_review_d", "/root/external_rereview_c"]
      approved_at: "2026-07-22"

  - id: C-ATK-011
    snapshot: 6ea2c5c04bc83b7be7633936c53851154b7203669505af50a6095531a38be592
    version: 1
    status: APPROVED
    kind: internal
    signatures:
      - "template<Colour colour_to_move> bool MoveGen::InCheck(Position const* pos)"
      - "template<Colour colour_to_move> void MoveGen::GenerateLegalMoves(Position* __restrict__ pos, MoveList* __restrict__ ml)"
      - "constexpr MoveList::MoveList()"
      - "[[nodiscard]] constexpr std::array<Move, MAX_MOVES>& MoveList::all() noexcept"
      - "[[nodiscard]] constexpr size_t MoveList::len() const noexcept"
    purpose: >-
      Classify standard checkmate and stalemate from the unmasked check predicate
      and an independently complete legal-move set.
    authority:
      type: FIDE
      reference: https://handbook.fide.com/chapter/E012023
    preconditions:
      - >-
        The expected check value and complete legal set are derived independently
        for a canonical legal FEN before TDFA observation. InCheck and legal
        generation use separately constructed equivalent fresh Positions under
        C-FEN-010, with aligned template colour.
      - >-
        InCheck satisfies C-ATK-010. Before generation the test constructs a
        dedicated MoveList, observes only all().size(), and calls
        GenerateLegalMoves only when the independently expected legal-set
        cardinality fits that capacity. Generation and post-call observation
        satisfy C-CHS-010 and C-MOV-011, including restoration and the len bound.
    result:
      - >-
        For every fitting row, post-call len() is no greater than the observed
        capacity and the checked prefix completely represents the independently
        expected legal set.
      - "Checkmate is exactly unmasked InCheck with an empty legal set; stalemate is exactly not InCheck with an empty legal set."
      - "A nonempty legal set is nonterminal under these two classifications, regardless of InCheck. No application result or corpus outcome flag is asserted."
    mutates:
      - "GenerateLegalMoves may populate only its dedicated MoveList and may transiently mutate its generation Position only within C-CHS-010's restoration boundary."
    preserves:
      - "Both supplied Positions' complete FEN-semantic snapshots on return and every unrelated object."
    failure:
      - "Malformed positions, template mismatch, expected legal sets larger than observed capacity, application outcomes, and draw adjudication are outside this card; no failure response is specified. A fitting incomplete legal set, failed len bound, or classification mismatch violates the result."
    ordering: explicitly unspecified
    determinism: "The terminal classification is deterministic for the stated Position."
    oracle:
      type: reference-model
      id: oracle/fide-check-v1+oracle/mailbox-legal-v1-terminal
    open_decisions: []
