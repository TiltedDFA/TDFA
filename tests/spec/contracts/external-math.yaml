schema_version: 1
snapshot: 6ea2c5c04bc83b7be7633936c53851154b7203669505af50a6095531a38be592
contract_set: external-math
authoring_stage: blind-contract-authoring
information_firewall:
  permitted_inputs:
    - tests/README.md
    - tests/spec/**
    - tests/data/**
    - perftsuite.epd
    - UCI, FEN, FIDE, and mathematical authorities
  implementation_inspected: false
  product_executed: false
scope: >-
  Narrow valid-domain behavior whose expected result is fixed without an owner
  policy. Every collection result below is an abstract mathematical set
  projection; raw storage, order, multiplicity, and capacity behavior are not
  contracted.

cards:
  - id: C-MTH-010
    snapshot: 6ea2c5c04bc83b7be7633936c53851154b7203669505af50a6095531a38be592
    version: 2
    status: APPROVED
    kind: mathematical
    signatures:
      - "constexpr Colour operator!(const Colour c)"
      - "template<typename T> float FloatDiv(T dividend, T divisor)"
      - "constexpr double Magics::pow(double x, unsigned int y) noexcept"
    purpose: >-
      Provide the two-colour complement and exact ordinary arithmetic used by
      finite test cases. This card does not establish ABI widths or exceptional
      floating-point behavior.
    authority:
      type: mathematical
      reference: oracle/exact-finite-arithmetic-v1
    preconditions:
      - "operator! receives exactly White or Black."
      - >-
        FloatDiv is instantiated as U8, U16, U32, U64, I16, int, or float. Its
        exact input pairs are (0,1), (1,1), (1,2), (3,2), and (8,8), plus
        (-1,1), (1,-2), and (-3,-2) for I16, int, and float, and the
        representable scale-by-two variants of those pairs. The divisor is
        nonzero and every operand and real quotient is finite and exactly
        representable as binary32.
      - >-
        Magics::pow receives x in {-4,-2,-1,-0.5,0,0.5,1,2,4} and y in 0..12,
        excluding 0^0. Every resulting value is finite and exactly representable
        as binary64.
    result:
      - "!White is Black, !Black is White, and !(!c) equals c."
      - "FloatDiv returns the real quotient rounded exactly to the stipulated binary32 value."
      - "Magics::pow returns the mathematical integer power x^y for the stipulated exact cases."
    mutates:
      - none
    preserves:
      - "All operands and program state."
    failure:
      - "Inputs outside the preconditions are outside this card; no failure response is specified."
    ordering: not applicable
    determinism: "Deterministic for the stated inputs."
    oracle:
      type: exhaustive-model
      id: oracle/exact-finite-arithmetic-v1
    open_decisions: []
    review:
      author: blind-contract-author
      approvers: [blind-contract-review-a, blind-contract-review-b]
      approved_at: "2026-07-21"

  - id: C-BIT-010
    snapshot: 6ea2c5c04bc83b7be7633936c53851154b7203669505af50a6095531a38be592
    version: 1
    status: APPROVED
    kind: mathematical
    signatures:
      - "template<Sq N> consteval BitBoard Magics::SqToBB() noexcept"
      - "constexpr BitBoard Magics::SqToBB(Sq index)"
      - "constexpr BitBoard Magics::GetLS1B(BitBoard bb) noexcept"
      - "constexpr Sq Magics::FindLS1B(BitBoard bb) noexcept"
      - "constexpr Sq Magics::FindMS1B(BitBoard board) noexcept"
      - "constexpr BitBoard Magics::PopLS1B(BitBoard board) noexcept"
      - "constexpr BitBoard Magics::PopMS1B(const BitBoard board) noexcept"
      - "constexpr Sq Magics::PopNRetLS1B(BitBoard& board) noexcept"
      - "constexpr U8 Magics::PopCnt(BitBoard bb) noexcept"
    purpose: >-
      Interpret BitBoard as a 64-coefficient binary vector and provide its
      valid-index, cardinality, and nonzero endpoint operations.
    authority:
      type: mathematical
      reference: oracle/ordered-64-bit-coefficient-set-v1
    preconditions:
      - "SqToBB receives a runtime or template index in 0..63."
      - "GetLS1B, FindLS1B, FindMS1B, PopLS1B, PopMS1B, and PopNRetLS1B receive a nonzero BitBoard."
      - "PopCnt may receive any BitBoard."
    result:
      - "SqToBB(i) is the one-hot vector with coefficient i set; its two declarations agree."
      - "PopCnt is the number of set coefficients and lies in 0..64."
      - "GetLS1B returns the one-hot least set coefficient."
      - "FindLS1B and FindMS1B return the least and greatest set indices respectively."
      - "PopLS1B and PopMS1B remove exactly the corresponding endpoint coefficient."
      - "PopNRetLS1B returns the least set index and removes exactly that coefficient from its reference operand."
