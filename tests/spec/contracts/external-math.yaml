  - id: C-CHS-011
    snapshot: 6ea2c5c04bc83b7be7633936c53851154b7203669505af50a6095531a38be592
    version: 1
    status: APPROVED
    kind: internal
    signatures:
      - "void Position::MakeMove(Move m)"
      - "void Position::UnmakeMove(Move m)"
    purpose: >-
      Apply a legal FIDE move to public semantic position state and reverse a
      matching immediate move only as far as public placement and side.
    authority:
      type: FIDE
      reference: https://handbook.fide.com/chapter/E012023 and standard six-field FEN transition semantics
    preconditions:
      - "MakeMove receives a Move denoting a legal move in the current independently legal Position."
      - "UnmakeMove receives exactly the Move most recently passed to MakeMove on that Position, in immediate LIFO order, with no intervening state mutation."
      - "Unmake observations under this card are restricted to the 64-square piece map, aggregate occupancies, and side to move."
    result:
      - "MakeMove performs the ordinary, capture, en-passant, castling, or selected q/r/b/n promotion placement effect and flips side to move."
      - "MakeMove updates the named castling-right set, en-passant target, halfmove clock, and fullmove number exactly as represented by the resulting standard FEN."
      - "A matching immediate UnmakeMove restores the preceding piece map, aggregate occupancies, captured piece, and side to move."
      - "This card makes no UnmakeMove restoration claim for rights, en-passant representation, clocks, raw ZKey, hash composition, or hidden history."
    mutates:
      - "Only the target Position, according to the stated transition or narrow reversal."
    preserves:
      - "On MakeMove, every square and semantic field not changed by the FIDE/FEN transition."
      - "On UnmakeMove, every object other than the target Position."
    failure:
      - "Illegal moves, mismatched/out-of-order/repeated unmake, empty history, and malformed positions are outside this card; no failure response is specified."
    ordering: not applicable
    determinism: "Deterministic for the stated Position, legal Move, and matching immediate history."
    oracle:
      type: reference-model
      id: oracle/fide-fen-single-transition-v1
    open_decisions: []
    review:
      author: blind-contract-author
      approvers: [blind-contract-review-a, blind-contract-review-b]
      approved_at: "2026-07-21"

catalogue_audit:
  interpretation: >-
    A test listed under mapped_DESIGNED has every asserted behavior covered by
    at least one card above. Partial coverage does not qualify. Records listed
    under designed_requiring_split_or_block remain catalogue candidates even if
    a valid subset is covered.
  mapped_DESIGNED:
