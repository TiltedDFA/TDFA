  - id: C-MOV-010
    snapshot: 6ea2c5c04bc83b7be7633936c53851154b7203669505af50a6095531a38be592
    version: 1
    status: APPROVED
    kind: mathematical
    signatures:
      - "constexpr Move Moves::EncodeMove(const Sq start_index, const Sq target_index, const MoveType move_type)"
      - "constexpr void Moves::DecodeMove(const Move move, Sq* __restrict__ start_index, Sq* __restrict__ target_index, MoveType* __restrict__ move_type)"
      - "constexpr U8 Moves::TargetSq(const Move move)"
      - "constexpr U8 Moves::StartSq(const Move move)"
      - "constexpr bool Moves::IsPromotionMove(const Move move)"
    purpose: >-
      Provide an injective product encoding and semantic projections for valid
      distinct-square chess moves without fixing a numeric bit layout.
    authority:
      type: mathematical
      reference: oracle/move-component-product-v1
    preconditions:
      - "Start and target are distinct values in 0..63."
      - >-
        MoveType is exactly one of mt_Quiet, mt_EnPassant, mt_Castling,
        mt_Capture, mt_QueenPromotion, mt_RookPromotion,
        mt_BishopPromotion, or mt_KnightPromotion.
      - "DecodeMove receives three non-null, non-aliasing output pointers and a Move returned by EncodeMove under this card."
      - "StartSq, TargetSq, and IsPromotionMove receive a Move returned by EncodeMove under this card."
    result:
      - "DecodeMove returns the exact start, target, and named MoveType used to encode the Move."
      - "StartSq and TargetSq return the same start and target projections."
      - "Re-encoding decoded components returns the original Move, and different valid tuples have different Move values."
      - "IsPromotionMove is true exactly for the four concrete promotion MoveTypes and false for the other four semantic MoveTypes."
    mutates:
      - "DecodeMove may write only its three output pointees."
    preserves:
      - "All other state."
    failure:
      - "Markers, null/bad/arbitrary encodings, equal squares, invalid squares, and invalid pointers are outside this card; no failure response is specified."
    ordering: not applicable
    determinism: "Deterministic for the stated inputs."
    oracle:
      type: exhaustive-model
      id: oracle/move-component-product-v1
    open_decisions: []
    review:
      author: blind-contract-author
      approvers: [blind-contract-review-a, blind-contract-review-b]
      approved_at: "2026-07-21"

  - id: C-MOV-011
    snapshot: 6ea2c5c04bc83b7be7633936c53851154b7203669505af50a6095531a38be592
    version: 3
    status: APPROVED
    kind: internal
    signatures:
      - "constexpr MoveList::MoveList()"
      - "constexpr Move MoveList::operator[](const size_t index) const noexcept"
      - "[[nodiscard]] constexpr std::array<Move, MAX_MOVES>& MoveList::all() noexcept"
      - "[[nodiscard]] constexpr size_t MoveList::len() const noexcept"
      - "constexpr void Moves::DecodeMove(const Move move, Sq* __restrict__ start_index, Sq* __restrict__ target_index, MoveType* __restrict__ move_type)"
    purpose: >-
      Expose only the logical populated prefix of a fresh MoveList generator
      result and decode each generated Move to its semantic tuple.
    authority:
      type: owner-decision
      reference: >-
        tests/spec/intended-purpose-v1.md firm rows for generated encoded moves,
        MoveList construction/len/operator[], and Moves::DecodeMove
    preconditions:
      - "Before any generator call or len() read, the test derives the expected logical result independently, constructs a MoveList, and observes only all().size() as that object's public backing capacity."
      - "The generator receives a non-null newly constructed MoveList and is called only when the independently expected logical-set cardinality is no greater than the observed backing capacity."
      - "After the call, len() is read and checked against the previously observed capacity before any operator[] access."
      - "DecodeMove receives three non-null, non-aliasing output pointers and a Move read from that populated prefix."
    result:
      - >-
        all().size() exposes the backing capacity used only to gate the call;
        this card fixes neither a minimum capacity nor constructor len() state.
      - >-
        When the independently expected logical set fits the observed capacity,
        the approved-domain generator call completes and post-call len() is no
        greater than that capacity. Only after this bound passes, indices
        [0,len()) may be read and, after set normalization, contain every and
        only independently expected logical result element.
      - "Storage at and beyond len() is unobserved; ordering and multiplicity within the populated prefix remain unspecified."
      - "Every populated generated Move is in C-MOV-010's distinct-square, eight-semantic-kind domain, and DecodeMove returns its logical source, target, and named MoveType."
      - "Tests may normalize the populated prefix to an unordered logical set; this card makes no ordering or multiplicity claim."
    mutates:
      - "The test uses all() only to read size() and does not mutate backing elements; len and indexed reads do not mutate the MoveList, and DecodeMove may write only its three output pointees."
    preserves:
      - "Prefix observation preserves the populated MoveList."
    failure:
      - "Constructor len() state, expected results larger than observed capacity, out-of-prefix reads, nonfresh lists, append-versus-replace on prior contents, backing-element mutation, unused storage, general overflow policy, duplicates, ordering, invalid inputs/encodings, and null pointers are outside this card; no failure response is specified. A fitting expected result with len()>capacity or an incomplete/extra logical prefix violates the result."
    ordering: explicitly unspecified
    determinism: "The normalized populated logical set and each Move's semantic decode are deterministic for the approved generator inputs."
    oracle:
      type: reference-model
      id: oracle/logical-generated-movelist-prefix-v1
    open_decisions: []
    review:
      author: blind-contract-author
      approvers: ["/root/app_review_d", "/root/external_rereview_c"]
      approved_at: "2026-07-22"

  - id: C-MOV-012
    snapshot: 6ea2c5c04bc83b7be7633936c53851154b7203669505af50a6095531a38be592
    version: 3
    status: APPROVED
    kind: internal
    signatures:
      - "template<AttackDirection direction> constexpr move_info const* MoveGen::GetMovesForSliding(Sq piece_sq, BitBoard us, BitBoard them) noexcept"
      - "std::array<Move, 7> move_info::encoded_move_"
      - "U8 move_info::count_"
      - "constexpr void Moves::DecodeMove(const Move move, Sq* __restrict__ start_index, Sq* __restrict__ target_index, MoveType* __restrict__ move_type)"
    purpose: >-
      Expose only the immediate logical populated prefix of a valid sliding
      move_info result and decode each populated Move to its semantic tuple.
    authority:
      type: owner-decision
      reference: >-
        tests/spec/intended-purpose-v1.md firm rows for GetMovesForSliding,
        move_info's bounded logical move group, and Moves::DecodeMove
    preconditions:
      - "GetMovesForSliding receives a valid source contained in us, disjoint us/them occupancies, and one of the four named AttackDirection instantiations."
      - "The expected logical sliding result is derived independently before the call, and the return value is checked immediately; no pointer-lifetime claim is made beyond that observation."
      - "For each populated Move reached after the result checks, DecodeMove receives three non-null, non-aliasing output pointers."
    result:
      - "When the independently expected logical result is nonempty, GetMovesForSliding returns a non-null move_info pointer. When it is empty, null is permitted and represents the empty logical result without dereference."
      - "For every non-null return, the test reads count_ and requires count_<=encoded_move_.size() before reading any encoded_move_ element."
      - "Only after the non-null and count-bounds checks, indices [0,count_) are read and contain every and only independently expected logical move after set normalization; a non-null empty result therefore has count_==0. Storage at and beyond count_ and attacks_ are unobserved."
      - "Every populated Move is in C-MOV-010's distinct-square, eight-semantic-kind domain, and DecodeMove returns its logical source, target, and named MoveType."
      - "Tests may normalize the populated prefix to an unordered logical set; this card makes no ordering or multiplicity claim."
    mutates:
      - "Immediate move_info field reads do not mutate the record; DecodeMove may write only its three output pointees."
    preserves:
      - "The supplied occupancies and source value."
    failure:
      - "Pointer lifetime after the immediate observation, dereferencing a null empty representation, reads before the count-bounds check, out-of-prefix reads, unused storage, attacks_, ordering, multiplicity, general overflow policy, overlapping occupancies, invalid directions/sources, and invalid generated encodings are outside this card; no failure response is specified. Null for a nonempty expected result, count_ greater than encoded_move_.size(), or an incomplete/extra checked prefix violates the result."
    ordering: explicitly unspecified
    determinism: "The normalized populated logical set and each Move's semantic decode are deterministic for the stated sliding inputs."
    oracle:
      type: reference-model
      id: oracle/logical-generated-move-info-prefix-v1
    open_decisions: []
    review:
      author: blind-contract-author
      approvers: ["/root/app_review_d", "/root/external_rereview_c"]
